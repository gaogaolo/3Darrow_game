    function shapeFramePoints() {
      const points = [];
      if (state.surface?.cells?.size) {
        for (const cell of state.surface.cells.values()) {
          for (const corner of cell.corners) points.push(corner.clone());
        }
      }
      if (!points.length) {
        for (const block of state.blocks) {
          if (!block.visible) continue;
          const [width, height, depth] = block.size;
          for (const sx of [-0.5, 0.5]) {
            for (const sy of [-0.5, 0.5]) {
              for (const sz of [-0.5, 0.5]) {
                points.push(localToWorld(block, vec(sx * width, sy * height, sz * depth)));
              }
            }
          }
        }
      }
      if (!points.length) {
        const fallback = new THREE.Box3().setFromCenterAndSize(vec(0, 0, 0), vec(6, 6, 6));
        const min = fallback.min;
        const max = fallback.max;
        return [
          vec(min.x, min.y, min.z),
          vec(min.x, min.y, max.z),
          vec(min.x, max.y, min.z),
          vec(min.x, max.y, max.z),
          vec(max.x, min.y, min.z),
          vec(max.x, min.y, max.z),
          vec(max.x, max.y, min.z),
          vec(max.x, max.y, max.z)
        ];
      }
      return points;
    }

    function boundsFromPoints(points) {
      const bounds = new THREE.Box3();
      for (const point of points) bounds.expandByPoint(point);
      return bounds;
    }

    function easeOutCubic(value) {
      const t = clamp(value, 0, 1);
      return 1 - Math.pow(1 - t, 3);
    }

    function isPointInsideBlock(point, block, margin = EPS) {
      const local = worldToLocal(block, point);
      const half = block.size.map((value) => value / 2);
      return Math.abs(local.x) <= half[0] + margin
        && Math.abs(local.y) <= half[1] + margin
        && Math.abs(local.z) <= half[2] + margin;
    }

    function isPointInsideUnion(point, blocks, margin = EPS) {
      return blocks.some((block) => isPointInsideBlock(point, block, margin));
    }

    function clampPointToBlock(point, block, inset = 0.06) {
      const local = worldToLocal(block, point);
      const half = block.size.map((value) => value / 2);
      const limits = half.map((value) => Math.max(0, value - Math.min(inset, value * 0.4)));
      local.set(
        clamp(local.x, -limits[0], limits[0]),
        clamp(local.y, -limits[1], limits[1]),
        clamp(local.z, -limits[2], limits[2])
      );
      return localToWorld(block, local);
    }

    function rewardNearbyBlockPoints(block, targetPoint, inset = 0.08) {
      if (!targetPoint) return [];
      const localTarget = worldToLocal(block, targetPoint);
      const half = block.size.map((value) => value / 2);
      const limits = half.map((value) => Math.max(0, value - Math.min(inset, value * 0.4)));
      const points = [];
      for (const xOffset of REWARD_CENTER_SEARCH_OFFSETS) {
        for (const yOffset of REWARD_CENTER_SEARCH_OFFSETS) {
          for (const zOffset of REWARD_CENTER_SEARCH_OFFSETS) {
            const local = vec(
              clamp(localTarget.x + xOffset, -limits[0], limits[0]),
              clamp(localTarget.y + yOffset, -limits[1], limits[1]),
              clamp(localTarget.z + zOffset, -limits[2], limits[2])
            );
            points.push(localToWorld(block, local));
          }
        }
      }
      return points;
    }

    function rewardCandidatePoints(blocks, centerFallback) {
      const points = [];
      const seen = new Set();
      const pushPoint = (point) => {
        const key = pointKey(point);
        if (seen.has(key)) return;
        seen.add(key);
        points.push(point.clone());
      };
      if (centerFallback) pushPoint(centerFallback);
      let weighted = vec(0, 0, 0);
      let totalVolume = 0;
      for (const block of blocks) {
        const center = localToWorld(block, vec(0, 0, 0));
        pushPoint(center);
        pushPoint(clampPointToBlock(centerFallback, block));
        for (const point of rewardNearbyBlockPoints(block, centerFallback)) pushPoint(point);
        const volume = block.size[0] * block.size[1] * block.size[2];
        weighted.add(center.clone().multiplyScalar(volume));
        totalVolume += volume;
      }
      if (totalVolume > EPS) {
        const weightedCenter = weighted.multiplyScalar(1 / totalVolume);
        pushPoint(weightedCenter);
        for (const block of blocks) {
          pushPoint(clampPointToBlock(weightedCenter, block));
          for (const point of rewardNearbyBlockPoints(block, weightedCenter)) pushPoint(point);
        }
      }
      for (let i = 0; i < blocks.length; i += 1) {
        const a = localToWorld(blocks[i], vec(0, 0, 0));
        for (let j = i + 1; j < blocks.length; j += 1) {
          const b = localToWorld(blocks[j], vec(0, 0, 0));
          pushPoint(a.clone().add(b).multiplyScalar(0.5));
        }
      }
      return points;
    }

    function rewardBoxSamplePoints(center, size) {
      const offsets = [-0.5, -0.25, 0, 0.25, 0.5];
      const points = [];
      for (const x of offsets) {
        for (const y of offsets) {
          for (const z of offsets) {
            points.push(center.clone().add(vec(
              x * size.x,
              y * size.y,
              z * size.z
            )));
          }
        }
      }
      return points;
    }

    function rewardBoxFitsUnion(center, size, blocks) {
      return rewardBoxSamplePoints(center, size).every((point) => isPointInsideUnion(point, blocks));
    }

    function rewardFitScaleAtPoint(center, desiredSize, blocks) {
      if (!isPointInsideUnion(center, blocks)) return 0;
      if (rewardBoxFitsUnion(center, desiredSize, blocks)) return 1;
      let low = 0;
      let high = 1;
      for (let iteration = 0; iteration < 18; iteration += 1) {
        const middle = (low + high) * 0.5;
        const size = desiredSize.clone().multiplyScalar(middle);
        if (rewardBoxFitsUnion(center, size, blocks)) low = middle;
        else high = middle;
      }
      return low;
    }

    function rewardMetrics() {
      const visibleBlocks = state.blocks.filter((block) => block.visible);
      const bounds = boundsFromPoints(shapeFramePoints());
      const size = bounds.getSize(new THREE.Vector3());
      const centerFallback = bounds.getCenter(new THREE.Vector3());
      const desiredSize = new THREE.Vector3(
        clamp(size.x * 0.56 + size.z * 0.1, 2.1, Math.max(2.6, size.x * 0.82)),
        clamp(Math.min(size.y * 0.38, Math.max(2.1, size.x * 0.82) * 0.34), 0.76, Math.max(0.94, size.y * 0.48)),
        clamp(Math.min(size.z * 0.58, Math.max(2.1, size.x * 0.82) * 0.56), 0.95, Math.max(1.3, Math.max(2.1, size.x * 0.82) * 0.62))
      );
      const candidates = rewardCandidatePoints(visibleBlocks, centerFallback);
      const scoredCandidates = [];
      for (const candidate of candidates) {
        const fitScale = rewardFitScaleAtPoint(candidate, new THREE.Vector3(
          desiredSize.x * REWARD_FOOTPRINT_SCALE.x,
          desiredSize.y * REWARD_FOOTPRINT_SCALE.y,
          desiredSize.z * REWARD_FOOTPRINT_SCALE.z
        ), visibleBlocks);
        if (fitScale <= EPS) continue;
        scoredCandidates.push({
          point: candidate,
          fitScale,
          distance: candidate.distanceTo(centerFallback),
          blocks: visibleBlocks.filter((block) => isPointInsideBlock(candidate, block))
        });
      }
      const comfortable = scoredCandidates.filter((candidate) => candidate.fitScale >= REWARD_MIN_FIT_SCALE);
      const ranked = (comfortable.length ? comfortable : scoredCandidates).sort((a, b) => (
        a.distance - b.distance
        || b.fitScale - a.fitScale
      ));
      const best = ranked[0] || {
        point: centerFallback.clone(),
        fitScale: 0.08,
        distance: 0,
        blocks: visibleBlocks
      };
      const fitScale = clamp(best.fitScale * REWARD_FIT_MARGIN, 0.08, 1);
      const width = desiredSize.x * fitScale;
      const height = desiredSize.y * fitScale;
      const depth = desiredSize.z * fitScale;
      const roomWidth = desiredSize.x * REWARD_FOOTPRINT_SCALE.x * fitScale;
      const roomHeight = desiredSize.y * REWARD_FOOTPRINT_SCALE.y * fitScale;
      const roomDepth = desiredSize.z * REWARD_FOOTPRINT_SCALE.z * fitScale;
      const radius = Math.min(width, depth) * 0.12;
      return {
        bounds,
        size,
        center: best.point,
        width,
        depth,
        height,
        radius,
        roomWidth,
        roomDepth,
        roomHeight,
        supportBlocks: best.blocks.map((block) => block.id),
        fitScale: best.fitScale,
        distanceToCenter: best.distance
      };
    }

    function roundedRectShape(width, depth, radius) {
      const shape = new THREE.Shape();
      const x = -width / 2;
      const y = -depth / 2;
      const r = Math.min(radius, width / 2, depth / 2);
      shape.moveTo(x + r, y);
      shape.lineTo(x + width - r, y);
      shape.quadraticCurveTo(x + width, y, x + width, y + r);
      shape.lineTo(x + width, y + depth - r);
      shape.quadraticCurveTo(x + width, y + depth, x + width - r, y + depth);
      shape.lineTo(x + r, y + depth);
      shape.quadraticCurveTo(x, y + depth, x, y + depth - r);
      shape.lineTo(x, y + r);
      shape.quadraticCurveTo(x, y, x + r, y);
      return shape;
    }

    function roundedBoxGeometry(width, height, depth, radius) {
      const geometry = new THREE.ExtrudeGeometry(roundedRectShape(width, depth, radius), {
        depth: height,
        bevelEnabled: true,
        bevelSize: Math.min(radius * 0.18, height * 0.08),
        bevelThickness: Math.min(radius * 0.24, height * 0.12),
        bevelSegments: 3,
        curveSegments: 10
      });
      geometry.center();
      geometry.rotateX(-Math.PI / 2);
      return geometry;
    }

    function moneyMaterial(color, options = {}) {
      return new THREE.MeshStandardMaterial({
        color,
        roughness: options.roughness ?? 0.48,
        metalness: options.metalness ?? 0.04,
        transparent: options.opacity !== undefined,
        opacity: options.opacity ?? 1,
        side: options.side || THREE.FrontSide,
        depthWrite: options.depthWrite ?? true,
        emissive: options.emissive ? new THREE.Color(options.emissive) : new THREE.Color(0x000000),
        emissiveIntensity: options.emissiveIntensity || 0
      });
    }

    function addTopMoneyDecals(group, width, depth, y) {
      const border = new THREE.Mesh(
        new THREE.PlaneGeometry(width * 0.75, depth * 0.58),
        moneyMaterial(MONEY_COLORS.print, { roughness: 0.62, metalness: 0.02, side: THREE.DoubleSide })
      );
      border.rotation.x = -Math.PI / 2;
      border.position.y = y;
      group.add(border);

      const inner = new THREE.Mesh(
        new THREE.PlaneGeometry(width * 0.61, depth * 0.4),
        moneyMaterial(MONEY_COLORS.billTop, { roughness: 0.62, metalness: 0.02, side: THREE.DoubleSide })
      );
      inner.rotation.x = -Math.PI / 2;
      inner.position.y = y + 0.006;
      group.add(inner);

      for (const sign of [-1, 1]) {
        const oval = new THREE.Mesh(
          new THREE.CircleGeometry(Math.max(0.08, depth * 0.17), 32),
          moneyMaterial(MONEY_COLORS.print, { roughness: 0.56, metalness: 0.02, side: THREE.DoubleSide })
        );
        oval.rotation.x = -Math.PI / 2;
        oval.position.set(sign * width * 0.18, y + 0.012, 0);
        oval.scale.x = Math.max(1.2, width / Math.max(depth, EPS) * 0.26);
        group.add(oval);
      }
    }

    function addMoneyBand(group, width, depth, height) {
      const bandWidth = width * 0.18;
      const stripWidth = width * 0.045;
      const bandHeight = height * 1.14;
      const bandDepth = depth * 1.13;
      const band = new THREE.Mesh(
        roundedBoxGeometry(bandWidth, bandHeight, bandDepth, Math.min(bandWidth, bandDepth) * 0.12),
        moneyMaterial(MONEY_COLORS.band, { roughness: 0.36, metalness: 0.04 })
      );
      group.add(band);
      for (const sign of [-1, 1]) {
        const strip = new THREE.Mesh(
          roundedBoxGeometry(stripWidth, bandHeight * 1.04, bandDepth * 1.03, stripWidth * 0.32),
          moneyMaterial(MONEY_COLORS.gold, { roughness: 0.28, metalness: 0.48, emissive: 0x5d4100, emissiveIntensity: 0.08 })
        );
        strip.position.x = sign * (bandWidth / 2 + stripWidth / 2);
        group.add(strip);
      }
    }

    function buildMoneyBundle(metrics, options = {}) {
      const group = new THREE.Group();
      group.name = "reward-money-bundle";
      const layerCount = options.layerCount ?? 3;
      const gap = clamp(metrics.height * 0.045, 0.025, 0.07);
      const layerHeight = (metrics.height - gap * (layerCount - 1)) / layerCount;
      for (let i = 0; i < layerCount; i += 1) {
        const layerGroup = new THREE.Group();
        const topLayer = i === layerCount - 1;
        const shrink = 1 - (layerCount - 1 - i) * 0.025;
        const layerWidth = metrics.width * shrink;
        const layerDepth = metrics.depth * (0.98 - (layerCount - 1 - i) * 0.012);
        const body = new THREE.Mesh(
          roundedBoxGeometry(layerWidth, layerHeight, layerDepth, metrics.radius),
          moneyMaterial(topLayer ? MONEY_COLORS.billTop : MONEY_COLORS.billSide, {
            roughness: 0.5,
            metalness: 0.06,
            emissive: topLayer ? 0x104400 : 0x002711,
            emissiveIntensity: topLayer ? 0.06 : 0.035
          })
        );
        layerGroup.add(body);
        const seam = new THREE.Mesh(
          new THREE.BoxGeometry(layerWidth * 0.98, Math.max(0.018, layerHeight * 0.08), layerDepth * 1.01),
          moneyMaterial(MONEY_COLORS.billDark, { roughness: 0.6, metalness: 0.04 })
        );
        seam.position.y = -layerHeight * 0.42;
        layerGroup.add(seam);
        if (topLayer) addTopMoneyDecals(layerGroup, layerWidth, layerDepth, layerHeight / 2 + 0.01);
        layerGroup.position.set((i - 1) * metrics.width * 0.008, -metrics.height / 2 + layerHeight / 2 + i * (layerHeight + gap), (1 - i) * metrics.depth * 0.01);
        group.add(layerGroup);
      }
      addMoneyBand(group, metrics.width, metrics.depth, metrics.height);
      group.traverse((node) => {
        if (node.isMesh) node.renderOrder = 1;
      });
      return group;
    }

    function buildMoneyPile(metrics) {
      const group = new THREE.Group();
      group.name = "reward-money-pile";
      group.position.copy(metrics.center);

      const glowOuter = new THREE.Mesh(
        new THREE.SphereGeometry(Math.max(metrics.width, metrics.depth) * 0.72, 24, 18),
        new THREE.MeshBasicMaterial({
          color: 0xffd92f,
          transparent: true,
          opacity: 0.1,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        })
      );
      glowOuter.scale.set(1.18, 0.72, 1.18);
      glowOuter.renderOrder = 0;
      glowOuter.userData = { rewardGlow: true };
      group.add(glowOuter);

      const glowInner = new THREE.Mesh(
        new THREE.SphereGeometry(Math.max(metrics.width, metrics.depth) * 0.46, 22, 16),
        new THREE.MeshBasicMaterial({
          color: 0xfff27a,
          transparent: true,
          opacity: 0.14,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        })
      );
      glowInner.scale.set(1.05, 0.62, 1.05);
      glowInner.position.y = metrics.height * 0.02;
      glowInner.renderOrder = 0;
      glowInner.userData = { rewardGlow: true };
      group.add(glowInner);

      const pileSpecs = [
        { scale: 0.94, x: -0.26, y: -0.22, z: -0.12, rotY: -0.28, tiltX: 0.02, tiltZ: -0.06 },
        { scale: 0.92, x: 0.02, y: -0.26, z: -0.2, rotY: 0.16, tiltX: -0.02, tiltZ: 0.05 },
        { scale: 0.88, x: 0.28, y: -0.18, z: 0.02, rotY: 0.42, tiltX: 0.03, tiltZ: -0.04 },
        { scale: 0.86, x: -0.06, y: -0.15, z: 0.23, rotY: -0.5, tiltX: 0.01, tiltZ: 0.06 },
        { scale: 0.82, x: -0.32, y: -0.04, z: 0.17, rotY: 0.58, tiltX: -0.03, tiltZ: 0.07 },
        { scale: 0.8, x: 0.22, y: -0.02, z: 0.22, rotY: -0.34, tiltX: 0.02, tiltZ: -0.05 },
        { scale: 0.78, x: -0.18, y: 0.08, z: -0.18, rotY: 0.3, tiltX: -0.03, tiltZ: 0.03 },
        { scale: 0.76, x: 0.08, y: 0.12, z: 0.06, rotY: -0.6, tiltX: 0.03, tiltZ: -0.02 },
        { scale: 0.74, x: -0.02, y: 0.2, z: 0.14, rotY: 0.14, tiltX: 0.02, tiltZ: 0.04 },
        { scale: 0.7, x: 0.16, y: 0.28, z: -0.06, rotY: -0.18, tiltX: -0.01, tiltZ: -0.03 },
        { scale: 0.66, x: -0.12, y: 0.34, z: 0.04, rotY: 0.46, tiltX: 0.02, tiltZ: 0.05 }
      ];

      for (let index = 0; index < pileSpecs.length; index += 1) {
        const spec = pileSpecs[index];
        const bundleMetrics = {
          ...metrics,
          width: metrics.width * spec.scale,
          depth: metrics.depth * spec.scale * 0.94,
          height: metrics.height * (0.58 + spec.scale * 0.14),
          radius: metrics.radius * spec.scale
        };
        const bundle = buildMoneyBundle(bundleMetrics, { layerCount: index < 4 ? 3 : 2 });
        bundle.position.set(spec.x * metrics.width, spec.y * metrics.height, spec.z * metrics.depth);
        bundle.rotation.set(spec.tiltX, spec.rotY, spec.tiltZ);
        bundle.userData = {
          fx: "rewardBundle",
          basePosition: bundle.position.clone(),
          baseRotation: bundle.rotation.clone(),
          baseScale: bundle.scale.clone(),
          drift: vec(spec.x * 0.28, Math.max(0.12, spec.y * 0.22 + 0.16), spec.z * 0.28),
          spin: vec(spec.tiltX * 0.28, spec.rotY * 0.08, spec.tiltZ * 0.28),
          phase: index * 0.73
        };
        group.add(bundle);
      }

      group.traverse((node) => {
        if (node.isMesh && !node.userData?.rewardGlow) node.renderOrder = 1;
      });
      return group;
    }

    function renderRewardCore() {
      const metrics = rewardMetrics();
      const group = buildMoneyPile(metrics);
      const pileBounds = new THREE.Box3().setFromObject(group);
      const pileSize = pileBounds.getSize(new THREE.Vector3());
      const fitScale = Math.min(
        metrics.roomWidth / Math.max(EPS, pileSize.x),
        metrics.roomHeight / Math.max(EPS, pileSize.y),
        metrics.roomDepth / Math.max(EPS, pileSize.z),
        1
      );
      const scale = Number.isFinite(fitScale) && fitScale > 0 ? fitScale : 1;
      group.scale.setScalar(scale);
      if (state.reward.unlocked) {
        group.userData = {
          fx: "rewardCore",
          basePosition: metrics.center.clone(),
          baseRotationY: 0,
          lift: metrics.height * 0.32 * scale
        };
        rewardFxNodes.push(group);
        for (const child of group.children) {
          if (child.userData?.fx === "rewardBundle") rewardFxNodes.push(child);
        }
        const light = new THREE.PointLight(0xffdc79, 2.6, Math.max(metrics.width, metrics.depth) * 5);
        light.position.copy(metrics.center);
        light.position.y += metrics.height * 0.75 * scale;
        group.userData.light = light;
        worldGroup.add(light);
      }
      worldGroup.add(group);
      return metrics;
    }

    function shardGeometry(points, center) {
      const geometry = new THREE.BufferGeometry();
      const positions = [];
      for (const point of points) {
        const local = point.clone().sub(center);
        positions.push(local.x, local.y, local.z);
      }
      geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      geometry.computeVertexNormals();
      return geometry;
    }

    function renderRewardCracks(metrics) {
      if (!state.reward.unlocked) return;
      const cells = [...state.surface.cells.values()];
      if (!cells.length) return;
      const stride = Math.max(1, Math.floor(cells.length / 42));
      let count = 0;
      for (let index = 0; index < cells.length && count < 48; index += stride) {
        const cell = cells[index];
        const cornerIndex = (index + count) % 4;
        const a = cell.corners[cornerIndex].clone();
        const b = cell.corners[(cornerIndex + 1) % 4].clone();
        const c = cell.center.clone()
          .add(cell.tangentU.clone().multiplyScalar(((count % 3) - 1) * 0.12))
          .add(cell.tangentV.clone().multiplyScalar((((count + 1) % 3) - 1) * 0.1));
        const center = a.clone().add(b).add(c).multiplyScalar(1 / 3).add(cell.normal.clone().multiplyScalar(0.075));
        const block = getBlock(cell.blockId);
        const material = new THREE.MeshStandardMaterial({
          color: block?.color || "#b9d9ff",
          transparent: true,
          opacity: 0.58,
          roughness: 0.72,
          metalness: 0.02,
          side: THREE.DoubleSide,
          depthWrite: false
        });
        const shard = new THREE.Mesh(shardGeometry([a, b, c], center), material);
        const outward = cell.center.clone().sub(metrics.center);
        if (outward.lengthSq() < EPS) outward.copy(cell.normal);
        outward.normalize();
        shard.position.copy(center);
        shard.renderOrder = 4;
        shard.userData = {
          fx: "rewardShard",
          basePosition: center.clone(),
          drift: cell.normal.clone().multiplyScalar(0.32 + (count % 5) * 0.055).add(outward.multiplyScalar(0.18)),
          spin: vec(0.8 + (count % 4) * 0.18, 0.55 + (count % 6) * 0.12, 0.72 + (count % 5) * 0.15),
          baseOpacity: 0.58
        };
        rewardFxNodes.push(shard);
        worldGroup.add(shard);
        count += 1;
      }
    }

    function updateRewardAnimation() {
      if (!state.reward.unlocked || !state.reward.revealAt || !rewardFxNodes.length) return;
      const age = performance.now() - state.reward.revealAt;
      const pop = easeOutCubic(age / 1050);
      const shimmer = Math.sin(age / 135) * 0.5 + 0.5;
      for (const node of rewardFxNodes) {
        if (node.userData?.fx === "rewardCore") {
          node.position.copy(node.userData.basePosition);
          node.position.y += node.userData.lift * pop + Math.sin(age / 190) * 0.025;
          node.rotation.y = node.userData.baseRotationY + age * 0.00055;
          const scale = 1 + 0.08 * Math.sin(Math.min(1, age / 760) * Math.PI);
          node.scale.setScalar(scale);
          if (node.userData.light) node.userData.light.intensity = 2.4 + shimmer * 1.3;
        } else if (node.userData?.fx === "rewardBundle") {
          const drift = easeOutCubic(age / 980) * 0.22;
          node.position.copy(node.userData.basePosition).add(node.userData.drift.clone().multiplyScalar(drift));
          node.position.y += Math.sin(age / 190 + node.userData.phase) * 0.008 * pop;
          node.rotation.copy(node.userData.baseRotation);
          node.rotation.x += node.userData.spin.x * drift;
          node.rotation.y += node.userData.spin.y * drift;
          node.rotation.z += node.userData.spin.z * drift;
          const scale = 1 + 0.03 * drift;
          node.scale.copy(node.userData.baseScale).multiplyScalar(scale);
        } else if (node.userData?.fx === "rewardShard") {
          node.position.copy(node.userData.basePosition).add(node.userData.drift.clone().multiplyScalar(pop));
          node.rotation.set(node.userData.spin.x * pop, node.userData.spin.y * pop, node.userData.spin.z * pop);
          node.scale.setScalar(1 + pop * 0.08);
          if (node.material) node.material.opacity = node.userData.baseOpacity * (1 - pop * 0.52);
        }
      }
    }

    function cameraBasis(direction) {
      const worldUp = Math.abs(direction.y) > 0.94 ? vec(0, 0, 1) : vec(0, 1, 0);
      const right = new THREE.Vector3().crossVectors(worldUp, direction).normalize();
      const up = new THREE.Vector3().crossVectors(direction, right).normalize();
      return { right, up };
    }

    function fitCameraToPoints(points, center, direction) {
      const aspect = Math.max(0.1, camera.aspect || 1);
      const vFov = THREE.MathUtils.degToRad(camera.fov);
      const hFov = 2 * Math.atan(Math.tan(vFov / 2) * aspect);
      const tanV = Math.tan(vFov / 2);
      const tanH = Math.tan(hFov / 2);
      const { right, up } = cameraBasis(direction);
      let requiredDistance = 4;
      let maxAhead = 0;
      let maxBehind = 0;
      let maxAbsX = 0;
      let maxAbsY = 0;
      for (const point of points) {
        const rel = point.clone().sub(center);
        const x = Math.abs(rel.dot(right));
        const y = Math.abs(rel.dot(up));
        const depthOffset = rel.dot(direction);
        maxAbsX = Math.max(maxAbsX, x);
        maxAbsY = Math.max(maxAbsY, y);
        maxAhead = Math.max(maxAhead, depthOffset);
        maxBehind = Math.max(maxBehind, -depthOffset);
        requiredDistance = Math.max(requiredDistance, x / Math.max(tanH, EPS) + depthOffset, y / Math.max(tanV, EPS) + depthOffset);
      }
      const distance = Math.max(7, requiredDistance * 1.22 + 0.75);
      let maxProjectedX = 0;
      let maxProjectedY = 0;
      for (const point of points) {
        const rel = point.clone().sub(center);
        const depthOffset = rel.dot(direction);
        const z = Math.max(0.001, distance - depthOffset);
        maxProjectedX = Math.max(maxProjectedX, Math.abs(rel.dot(right)) / (z * Math.max(tanH, EPS)));
        maxProjectedY = Math.max(maxProjectedY, Math.abs(rel.dot(up)) / (z * Math.max(tanV, EPS)));
      }
      const bounds = boundsFromPoints(points);
      const sphere = bounds.getBoundingSphere(new THREE.Sphere());
      return {
        distance,
        right,
        up,
        maxAhead,
        maxBehind,
        maxAbsX,
        maxAbsY,
        maxProjectedX,
        maxProjectedY,
        radius: sphere.radius
      };
    }

    function resetCameraView(announce = true) {
      if (!camera || !controls) return null;
      const points = shapeFramePoints();
      const bounds = boundsFromPoints(points);
      const center = bounds.getCenter(new THREE.Vector3());
      const direction = vec(0.92, 0.68, 1).normalize();
      const fit = fitCameraToPoints(points, center, direction);
      controls.target.copy(center);
      camera.position.copy(center.clone().add(direction.clone().multiplyScalar(fit.distance)));
      camera.near = Math.max(0.03, (fit.distance - fit.maxAhead) / 120);
      camera.far = Math.max(200, fit.distance + fit.maxBehind + fit.radius * 8);
      camera.up.set(0, 1, 0);
      camera.lookAt(center);
      camera.updateProjectionMatrix();
      controls.minDistance = Math.max(1.5, fit.radius * 0.2);
      controls.maxDistance = Math.max(32, fit.distance * 6, fit.radius * 10);
      controls.update();
      const frameInfo = {
        center: [center.x, center.y, center.z].map((value) => Number(value.toFixed(3))),
        distance: Number(fit.distance.toFixed(3)),
        radius: Number(fit.radius.toFixed(3)),
        pointCount: points.length,
        coverage: {
          maxProjectedX: Number(fit.maxProjectedX.toFixed(3)),
          maxProjectedY: Number(fit.maxProjectedY.toFixed(3))
        }
      };
      state.lastCameraFrame = frameInfo;
      renderFrame();
      if (announce) setStatus("视角已复位");
      return frameInfo;
    }

    function resizeThree() {
      if (!renderer || !camera) return;
      const rect = els.viewportHost.getBoundingClientRect();
      const width = Math.max(320, Math.floor(rect.width));
      const height = Math.max(420, Math.floor(rect.height));
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderFrame();
    }

    function renderFrame() {
      if (!renderer || !scene || !camera) return;
      controls?.update();
      renderer.render(scene, camera);
    }

    function animate() {
      animationHandle = requestAnimationFrame(animate);
      updateRewardAnimation();
      renderFrame();
    }

    function disposeGroup(group) {
      while (group.children.length) {
        const child = group.children.pop();
        child.traverse?.((node) => {
          node.geometry?.dispose?.();
          if (Array.isArray(node.material)) node.material.forEach((mat) => mat.dispose?.());
          else node.material?.dispose?.();
        });
      }
    }

    function renderThree() {
      if (!worldGroup) return;
      disposeGroup(worldGroup);
      rewardFxNodes = [];
      const interactive = [];
      renderBlockShells();
      const metrics = renderRewardCore();
      renderSurfaceCells(interactive);
      renderCoveredCells();
      renderArrows();
      renderRewardCracks(metrics);
      renderIssueEdges();
      worldGroup.userData.interactive = interactive;
      renderFrame();
    }

    function renderBlockShells() {
      for (const block of state.blocks) {
        if (!block.visible) continue;
        const revealed = state.reward.unlocked;
        const geo = new THREE.BoxGeometry(block.size[0], block.size[1], block.size[2]);
        const mat = new THREE.MeshStandardMaterial({
          color: block.color,
          transparent: true,
          opacity: revealed ? (block.id === state.selectedBlockId ? 0.09 : 0.035) : (block.id === state.selectedBlockId ? 0.14 : 0.07),
          roughness: 0.62,
          metalness: 0.08,
          side: THREE.DoubleSide,
          depthWrite: false
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(...block.position);
        mesh.quaternion.copy(blockQuaternion(block));
        worldGroup.add(mesh);
        const edges = new THREE.EdgesGeometry(geo);
        const lineMat = new THREE.LineBasicMaterial({ color: block.id === state.selectedBlockId ? 0xa8ef32 : 0x93b8cf, transparent: true, opacity: revealed ? (block.id === state.selectedBlockId ? 0.7 : 0.22) : (block.id === state.selectedBlockId ? 0.92 : 0.34), depthWrite: false });
        const lines = new THREE.LineSegments(edges, lineMat);
        lines.position.copy(mesh.position);
        lines.quaternion.copy(mesh.quaternion);
        worldGroup.add(lines);
      }
    }

    function cellQuaternion(cell) {
      const xAxis = cell.tangentU.clone().normalize();
      const yAxis = cell.tangentV.clone().multiplyScalar(-1).normalize();
      const zAxis = cell.normal.clone().normalize();
      const matrix = new THREE.Matrix4();
      matrix.makeBasis(xAxis, yAxis, zAxis);
      return new THREE.Quaternion().setFromRotationMatrix(matrix);
    }

    function renderSurfaceCells(interactive) {
      const removable = currentlyRemovableIds();
      const drawSet = new Set(state.drawPath);
      const cellGeo = new THREE.PlaneGeometry(0.92, 0.92);
      const revealed = state.reward.unlocked;
      for (const cell of state.surface.cells.values()) {
        const arrowId = state.gridMap.get(cell.id);
        const arrow = arrowId !== undefined ? getArrow(arrowId) : null;
        const block = getBlock(cell.blockId);
        let color = block?.color || "#19d8ff";
        let opacity = revealed ? 0.16 : 0.38;
        if (state.blockedCells.has(cell.id)) {
          color = "#687988";
          opacity = revealed ? 0.52 : 0.9;
        }
        if (drawSet.has(cell.id)) {
          color = "#ffc857";
          opacity = 0.96;
        }
        if (arrow) {
          color = state.lineStyle ? "#f4fbff" : arrow.color;
          opacity = revealed ? 0.72 : 0.88;
        }
        const selected = state.selectedCellId === cell.id || (arrow && arrow.id === state.selectedArrowId);
        const mat = new THREE.MeshStandardMaterial({
          color,
          transparent: true,
          opacity,
          roughness: 0.58,
          metalness: 0.04,
          side: THREE.DoubleSide,
          depthWrite: false,
          emissive: selected ? new THREE.Color(0xa8ef32) : new THREE.Color(0x000000),
          emissiveIntensity: selected ? 0.28 : 0
        });
        const mesh = new THREE.Mesh(cellGeo, mat);
        mesh.position.copy(cell.center.clone().add(cell.normal.clone().multiplyScalar(0.018)));
        mesh.quaternion.copy(cellQuaternion(cell));
        mesh.userData = { type: "cell", cellId: cell.id, blockId: cell.blockId };
        worldGroup.add(mesh);
        interactive.push(mesh);
        if (arrow && removable.has(arrow.id)) {
          const ring = new THREE.Mesh(
            new THREE.RingGeometry(0.31, 0.41, 28),
            new THREE.MeshBasicMaterial({ color: 0xa8ef32, transparent: true, opacity: 0.78, side: THREE.DoubleSide })
          );
          ring.position.copy(cell.center.clone().add(cell.normal.clone().multiplyScalar(0.038)));
          ring.quaternion.copy(mesh.quaternion);
          worldGroup.add(ring);
        }
      }
    }

    function renderCoveredCells() {
      if (!state.showCovered) return;
      const cellGeo = new THREE.PlaneGeometry(0.9, 0.9);
      for (const cell of state.surface.coveredCells) {
        const mat = new THREE.MeshBasicMaterial({ color: 0xff4f7a, transparent: true, opacity: 0.22, side: THREE.DoubleSide });
        const mesh = new THREE.Mesh(cellGeo, mat);
        mesh.position.copy(cell.center.clone().add(cell.normal.clone().multiplyScalar(0.012)));
        mesh.quaternion.copy(cellQuaternion(cell));
        worldGroup.add(mesh);
      }
    }

    function renderArrows() {
      for (const arrow of state.arrows) {
        for (let i = 1; i < arrow.path.length; i += 1) {
          const a = state.surface.cells.get(arrow.path[i - 1]);
          const b = state.surface.cells.get(arrow.path[i]);
          if (!a || !b) continue;
          const start = a.center.clone().add(a.normal.clone().multiplyScalar(0.08));
          const end = b.center.clone().add(b.normal.clone().multiplyScalar(0.08));
          const cylinder = cylinderBetween(start, end, 0.07, state.lineStyle ? "#f4fbff" : arrow.color);
          cylinder.userData = { type: "arrow", arrowId: arrow.id };
          worldGroup.add(cylinder);
        }
        addHeadTriangle(arrow);
      }
    }

    function cylinderBetween(a, b, radius, color) {
      const direction = b.clone().sub(a);
      const length = direction.length();
      const geometry = new THREE.CylinderGeometry(radius, radius, Math.max(0.001, length), 12);
      const material = new THREE.MeshStandardMaterial({ color, roughness: 0.42, metalness: 0.08, transparent: true, opacity: 0.86, depthWrite: false });
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.copy(a.clone().add(b).multiplyScalar(0.5));
      mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
      return mesh;
    }

    function trianglePoints(dir, size) {
      const s = size;
      return {
        U: [[0, s], [-s * 0.78, -s * 0.62], [s * 0.78, -s * 0.62]],
        D: [[0, -s], [s * 0.78, s * 0.62], [-s * 0.78, s * 0.62]],
        L: [[-s, 0], [s * 0.62, -s * 0.78], [s * 0.62, s * 0.78]],
        R: [[s, 0], [-s * 0.62, s * 0.78], [-s * 0.62, -s * 0.78]]
      }[dir];
    }

    function addHeadTriangle(arrow) {
      const cell = state.surface.cells.get(arrow.path[0]);
      if (!cell) return;
      const shape = new THREE.Shape();
      const points = trianglePoints(arrow.dir, 0.36);
      shape.moveTo(points[0][0], points[0][1]);
      shape.lineTo(points[1][0], points[1][1]);
      shape.lineTo(points[2][0], points[2][1]);
      shape.closePath();
      const mesh = new THREE.Mesh(
        new THREE.ShapeGeometry(shape),
        new THREE.MeshStandardMaterial({
          color: state.lineStyle ? "#071018" : "#061018",
          roughness: 0.45,
          metalness: 0.05,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.88,
          depthWrite: false,
          emissive: arrow.id === state.selectedArrowId ? new THREE.Color(0xa8ef32) : new THREE.Color(0x000000),
          emissiveIntensity: arrow.id === state.selectedArrowId ? 0.3 : 0
        })
      );
      mesh.position.copy(cell.center.clone().add(cell.normal.clone().multiplyScalar(0.11)));
      mesh.quaternion.copy(cellQuaternion(cell));
      mesh.userData = { type: "arrow", arrowId: arrow.id };
      worldGroup.add(mesh);
    }

    function renderIssueEdges() {
      const material = new THREE.LineBasicMaterial({ color: 0xff4f7a, transparent: true, opacity: 0.95 });
      for (const issue of state.surface.issues) {
        if (issue.type !== "ambiguous_edge") continue;
        const cell = state.surface.cells.get(issue.cellId);
        if (!cell) continue;
        const edge = cell.edges[issue.dir];
        const geo = new THREE.BufferGeometry().setFromPoints([
          edge.a.clone().add(cell.normal.clone().multiplyScalar(0.08)),
          edge.b.clone().add(cell.normal.clone().multiplyScalar(0.08))
        ]);
        worldGroup.add(new THREE.Line(geo, material));
      }
    }

    function handlePointerUp(event) {
      if (!pointerDown) return;
      const moved = Math.hypot(event.clientX - pointerDown.x, event.clientY - pointerDown.y);
      const elapsed = performance.now() - pointerDown.time;
      pointerDown = null;
      if (moved > 6 || elapsed > 650) return;
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(worldGroup.userData.interactive || [], false);
      if (!hits.length) return;
      const data = hits[0].object.userData;
      if (data.cellId) handleCellAction(data.cellId);
    }

    function wireEvents() {
      document.getElementById("btnGenerate").addEventListener("click", fillGeneratedArrows);
      document.getElementById("btnValidate").addEventListener("click", runValidate);
      document.getElementById("btnExport").addEventListener("click", () => {
        exportLevel();
        setStatus("JSON 已导出");
      });
      document.getElementById("btnClearArrows").addEventListener("click", clearArrows);
      document.getElementById("btnAddBlock").addEventListener("click", () => addBlock());
      document.getElementById("btnAttachBlock").addEventListener("click", attachBlockToSelectedCell);
      document.getElementById("btnDuplicateBlock").addEventListener("click", duplicateSelectedBlock);
      document.getElementById("btnDeleteBlock").addEventListener("click", deleteSelectedBlock);
      document.getElementById("btnMoveBlockToCell").addEventListener("click", moveSelectedBlockToCell);
      document.getElementById("btnApplyBlock").addEventListener("click", applyBlockForm);
      document.getElementById("btnUndoDraw").addEventListener("click", undoDrawPath);
      document.getElementById("btnFinishDraw").addEventListener("click", finishDrawPath);
      document.getElementById("btnClearBlocks").addEventListener("click", clearBlockedCells);
      document.getElementById("btnSolveStep").addEventListener("click", removeOneBatch);
      document.getElementById("btnResetCamera").addEventListener("click", () => resetCameraView(true));
      document.getElementById("btnImport").addEventListener("click", importLevel);
      document.getElementById("btnDownload").addEventListener("click", downloadJson);
      document.getElementById("btnSample").addEventListener("click", loadSample);
      els.inputSnap.addEventListener("change", () => {
        state.snapAngle = Number(els.inputSnap.value) || 15;
        renderStats();
      });
      els.inputDebugCovered.addEventListener("change", () => {
        state.showCovered = els.inputDebugCovered.checked;
        renderThree();
      });
      els.lineStyle.addEventListener("change", () => {
        state.lineStyle = els.lineStyle.checked;
        document.body.classList.toggle("line-style", state.lineStyle);
        renderAll();
      });
      for (const button of document.querySelectorAll(".segmented button")) {
        button.addEventListener("click", () => setMode(button.dataset.mode));
      }
      for (const button of document.querySelectorAll("[data-move-axis]")) {
        button.addEventListener("click", () => nudgeSelectedBlock(Number(button.dataset.moveAxis), Number(button.dataset.moveDelta)));
      }
      for (const button of document.querySelectorAll("[data-rotate-axis]")) {
        button.addEventListener("click", () => rotateSelectedBlock(Number(button.dataset.rotateAxis), Number(button.dataset.rotateDelta)));
      }
    }

    function bootstrap() {
      state.blocks = [
        normalizeBlock({ Id: "A", BlockSize: [6, 4, 4], Position: [0, 0, 0], RotationDeg: [0, 0, 0], Color: "#19d8ff" }, "A"),
        normalizeBlock({ Id: "B", BlockSize: [4, 4, 4], Position: [5, 0, 0], RotationDeg: [0, 0, 0], Color: "#b875ff" }, "B")
      ];
      state.selectedBlockId = "A";
      buildSurface();
      syncBlockForm();
      wireEvents();
      initThree();
      renderAll();
      exportLevel();
    }

    bootstrap();

    window.compoundArrowEditor = {
      state,
      buildSurface,
      findDirectionBetweenCells,
      getPlanarRay,
      getForwardRay,
      getSurfaceTrace,
      canRemoveArrow,
      quickSolveCheck,
      moveSelectedBlockToCell,
      resetCameraView,
      exportLevel,
      importLevel
    };

    window.addEventListener("beforeunload", () => {
      if (animationHandle) cancelAnimationFrame(animationHandle);
    });
  </script>
</body>
</html>
