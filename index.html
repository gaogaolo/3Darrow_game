<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D 箭头组合体编辑器</title>
  <link rel="icon" href="data:,">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js"
      }
    }
  </script>
  <style>
    :root {
      --space: #080e15;
      --space-2: #101923;
      --panel: rgba(18, 28, 38, 0.88);
      --panel-solid: #152130;
      --panel-soft: rgba(31, 45, 59, 0.82);
      --line: rgba(134, 167, 190, 0.32);
      --line-strong: rgba(169, 211, 237, 0.54);
      --ink: #eef8ff;
      --muted: #9fb2c2;
      --cyan: #19d8ff;
      --violet: #b875ff;
      --lime: #a8ef32;
      --rose: #ff4f7a;
      --amber: #ffc857;
      --radius: 8px;
      --shadow: 0 22px 58px rgba(0, 0, 0, 0.36);
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 22% 14%, rgba(25, 216, 255, 0.16), transparent 24%),
        radial-gradient(circle at 78% 18%, rgba(184, 117, 255, 0.12), transparent 22%),
        linear-gradient(180deg, #081019, #0b1118 56%, #060a10);
      letter-spacing: 0;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.9) 0 1px, transparent 1.4px),
        radial-gradient(circle, rgba(125,194,255,0.72) 0 1px, transparent 1.2px);
      background-size: 82px 82px, 47px 47px;
      background-position: 8px 12px, 31px 21px;
      opacity: 0.28;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      letter-spacing: 0;
    }

    button,
    input,
    select,
    textarea {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(8, 14, 21, 0.88);
      color: var(--ink);
    }

    button {
      min-height: 36px;
      padding: 0 12px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 140ms ease, border-color 140ms ease, background 140ms ease;
    }

    button:hover {
      transform: translateY(-1px);
      border-color: var(--line-strong);
      background: rgba(25, 216, 255, 0.12);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.48;
      transform: none;
    }

    input,
    select {
      width: 100%;
      min-height: 36px;
      padding: 0 10px;
    }

    textarea {
      width: 100%;
      min-height: 168px;
      padding: 12px;
      resize: vertical;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      line-height: 1.45;
      color: #d9f4ff;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 3px solid rgba(25, 216, 255, 0.28);
      outline-offset: 2px;
    }

    .app {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      min-height: 72px;
      display: grid;
      grid-template-columns: minmax(250px, 1fr) auto auto;
      align-items: center;
      gap: 16px;
      padding: 12px 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(7, 12, 18, 0.88);
      backdrop-filter: blur(16px);
    }

    .brand {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand > div {
      min-width: 0;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      position: relative;
      border: 1px solid rgba(25, 216, 255, 0.72);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(25, 216, 255, 0.35), transparent 48%),
        linear-gradient(45deg, transparent 50%, rgba(184, 117, 255, 0.32) 51%),
        #09131f;
      box-shadow: 0 0 18px rgba(25, 216, 255, 0.2), inset 0 0 18px rgba(184, 117, 255, 0.12);
    }

    .brand-mark::before,
    .brand-mark::after {
      content: "";
      position: absolute;
      background: var(--cyan);
      opacity: 0.85;
    }

    .brand-mark::before {
      width: 2px;
      height: 31px;
      left: 20px;
      top: 5px;
      transform: rotate(34deg);
    }

    .brand-mark::after {
      width: 27px;
      height: 2px;
      left: 7px;
      top: 20px;
      transform: rotate(-22deg);
    }

    h1 {
      margin: 0;
      font-size: clamp(18px, 2vw, 26px);
      line-height: 1.05;
      font-weight: 900;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status-line {
      margin: 5px 0 0;
      min-height: 18px;
      color: var(--muted);
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .stats {
      display: grid;
      grid-auto-flow: column;
      gap: 8px;
      align-items: center;
    }

    .stat {
      min-width: 74px;
      display: grid;
      gap: 2px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(13, 21, 30, 0.74);
    }

    .stat b {
      font-size: 17px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .stat span {
      color: var(--muted);
      font-size: 11px;
    }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .primary {
      color: #041018;
      border-color: rgba(25, 216, 255, 0.78);
      background: linear-gradient(180deg, #38e7ff, #18bddf);
    }

    .lime {
      color: #071305;
      border-color: rgba(168, 239, 50, 0.8);
      background: linear-gradient(180deg, #bdf85a, #92db24);
    }

    .danger {
      color: #fff;
      border-color: rgba(255, 79, 122, 0.82);
      background: rgba(255, 79, 122, 0.72);
    }

    .workspace {
      display: grid;
      grid-template-columns: 310px minmax(360px, 0.92fr) minmax(440px, 1.12fr);
      gap: 14px;
      padding: 14px;
      min-height: 0;
    }

    .panel,
    .atlas-panel,
    .three-panel,
    .json-dock {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .panel {
      overflow: auto;
      max-height: calc(100vh - 104px);
      padding: 14px;
    }

    .control-section {
      padding: 0 0 14px;
      margin: 0 0 14px;
      border-bottom: 1px solid var(--line);
    }

    .control-section:last-child {
      border-bottom: 0;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .panel-title,
    .section-title {
      margin: 0;
      font-size: 14px;
      font-weight: 900;
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .field.wide {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      margin: 0 0 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .button-grid .wide {
      grid-column: 1 / -1;
    }

    .control-subtitle {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }

    .axis-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 8px;
    }

    .axis-grid button {
      min-width: 0;
      padding: 0 8px;
      font-variant-numeric: tabular-nums;
    }

    .exact-panel {
      margin-top: 12px;
      border-top: 1px solid var(--line);
      padding-top: 10px;
    }

    .exact-panel summary {
      cursor: pointer;
      color: var(--ink);
      font-size: 12px;
      font-weight: 900;
      list-style-position: inside;
    }

    .segmented {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      padding: 4px;
      gap: 4px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(8, 14, 21, 0.68);
      margin-top: 10px;
    }

    .segmented button {
      min-height: 32px;
      padding: 0 6px;
      border: 0;
      background: transparent;
      color: var(--muted);
    }

    .segmented button.active {
      color: #041018;
      background: var(--cyan);
    }

    .toggle-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 36px;
      gap: 10px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(8, 14, 21, 0.72);
    }

    .block-list {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .block-row {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(8, 14, 21, 0.7);
      cursor: pointer;
    }

    .block-row.active {
      border-color: rgba(25, 216, 255, 0.9);
      box-shadow: inset 0 0 0 1px rgba(25, 216, 255, 0.3);
    }

    .swatch {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      border: 1px solid rgba(255, 255, 255, 0.38);
    }

    .block-meta {
      min-width: 0;
      display: grid;
      gap: 1px;
    }

    .block-meta strong,
    .block-meta span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .block-meta span,
    .small-note {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(8, 14, 21, 0.72);
      color: var(--ink);
      font-size: 12px;
      font-weight: 850;
      white-space: nowrap;
    }

    .chip.good {
      color: #071305;
      border-color: rgba(168, 239, 50, 0.8);
      background: var(--lime);
    }

    .chip.warn {
      color: #1b1100;
      border-color: rgba(255, 200, 87, 0.8);
      background: var(--amber);
    }

    .chip.bad {
      color: #fff;
      border-color: rgba(255, 79, 122, 0.85);
      background: rgba(255, 79, 122, 0.72);
    }

    .atlas-panel,
    .three-panel {
      min-height: 0;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .panel-head {
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(18, 28, 38, 0.88);
    }

    .panel-head-actions {
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
    }

    .panel-head-actions button {
      min-height: 30px;
      padding: 0 10px;
      font-size: 12px;
    }

    .sub {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .atlas-scroll {
      overflow: auto;
      padding: 14px;
    }

    .atlas-list {
      display: grid;
      gap: 14px;
    }

    .atlas-group {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      background: rgba(7, 12, 18, 0.62);
    }

    .atlas-title {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 10px;
      border-bottom: 1px solid var(--line);
      background: rgba(25, 216, 255, 0.08);
      font-size: 12px;
      font-weight: 900;
    }

    .atlas-grid-wrap {
      overflow: auto;
      padding: 8px;
    }

    .atlas-grid {
      display: grid;
      gap: 3px;
      width: max-content;
      min-width: 100%;
    }

    .atlas-cell {
      width: 18px;
      height: 18px;
      min-height: 18px;
      padding: 0;
      border-radius: 4px;
      border-color: rgba(169, 211, 237, 0.32);
      background: rgba(25, 216, 255, 0.16);
    }

    .atlas-cell.occupied {
      background: var(--arrow-color, var(--cyan));
      border-color: rgba(255, 255, 255, 0.42);
    }

    .atlas-cell.blocked {
      background: rgba(120, 132, 144, 0.75);
    }

    .atlas-cell.selected {
      outline: 2px solid var(--lime);
      outline-offset: 1px;
    }

    .viewport {
      position: relative;
      height: clamp(520px, 68vh, 760px);
      min-height: 520px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 30%, rgba(25, 216, 255, 0.08), transparent 42%), #070d14;
    }

    #threeViewport {
      display: block;
      width: 100%;
      height: 100%;
    }

    .viewport-badge {
      position: absolute;
      left: 12px;
      bottom: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      pointer-events: none;
    }

    .inspector {
      min-height: 62px;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-top: 1px solid var(--line);
      background: rgba(18, 28, 38, 0.88);
    }

    .inspector strong,
    .inspector span {
      display: block;
    }

    .inspector span {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.38;
    }

    .json-dock {
      display: grid;
      grid-template-columns: 1fr 138px;
      gap: 12px;
      margin: 0 14px 14px;
      padding: 14px;
    }

    .json-actions {
      display: grid;
      align-content: start;
      gap: 8px;
      padding-top: 29px;
    }

    .issue-list {
      display: grid;
      gap: 8px;
      margin-top: 10px;
      max-height: 160px;
      overflow: auto;
    }

    .issue {
      padding: 8px;
      border: 1px solid rgba(255, 200, 87, 0.42);
      border-radius: var(--radius);
      background: rgba(255, 200, 87, 0.12);
      color: #ffe2a3;
      font-size: 12px;
      line-height: 1.35;
    }

    .line-style .atlas-cell.occupied {
      background: #f4fbff;
    }

    @media (max-width: 1180px) {
      .workspace {
        grid-template-columns: 300px 1fr;
      }

      .three-panel {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 760px) {
      .topbar {
        position: static;
        grid-template-columns: 1fr;
      }

      .stats {
        grid-auto-flow: row;
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .top-actions {
        justify-content: stretch;
      }

      .top-actions button {
        flex: 1 1 auto;
      }

      .workspace {
        grid-template-columns: 1fr;
        padding: 10px;
      }

      .panel {
        max-height: none;
      }

      .viewport {
        height: 430px;
        min-height: 430px;
      }

      .json-dock {
        grid-template-columns: 1fr;
        margin: 0 10px 10px;
      }

      .json-actions {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        padding-top: 0;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div>
          <h1>3D 箭头组合体编辑器</h1>
          <p class="status-line" id="statusLine">已就绪</p>
        </div>
      </div>
      <div class="stats" aria-live="polite">
        <div class="stat"><b id="statBlocks">0</b><span>方块</span></div>
        <div class="stat"><b id="statSurface">0</b><span>表面格</span></div>
        <div class="stat"><b id="statArrows">0</b><span>箭头</span></div>
        <div class="stat"><b id="statIssues">0</b><span>问题</span></div>
      </div>
      <div class="top-actions">
        <button class="primary" id="btnGenerate">生成</button>
        <button id="btnValidate">校验</button>
        <button id="btnExport">导出</button>
        <button class="danger" id="btnClearArrows">清箭头</button>
      </div>
    </header>

    <main class="workspace">
      <aside class="panel">
        <section class="control-section">
          <h2 class="panel-title">结构</h2>
          <div class="button-grid">
            <button class="primary" id="btnAddBlock">自由添加</button>
            <button class="lime" id="btnAttachBlock">贴面添加</button>
            <button id="btnDuplicateBlock">复制</button>
            <button class="danger" id="btnDeleteBlock">删除</button>
          </div>
          <div class="field-grid">
            <div class="field">
              <label for="inputSnap">角度吸附</label>
              <select id="inputSnap">
                <option value="15">15°</option>
                <option value="30">30°</option>
                <option value="45">45°</option>
                <option value="90">90°</option>
              </select>
            </div>
            <div class="field">
              <label for="inputDebugCovered">覆盖格</label>
              <div class="toggle-line">
                <span>显示</span>
                <input id="inputDebugCovered" type="checkbox" role="switch">
              </div>
            </div>
          </div>
          <div class="block-list" id="blockList"></div>
        </section>

        <section class="control-section">
          <h2 class="panel-title">选中 Block</h2>
          <div class="field-grid">
            <div class="field">
              <label for="inputSizeW">宽 W</label>
              <input id="inputSizeW" type="number" min="1" max="24" step="1">
            </div>
            <div class="field">
              <label for="inputSizeH">高 H</label>
              <input id="inputSizeH" type="number" min="1" max="24" step="1">
            </div>
            <div class="field">
              <label for="inputSizeD">深 D</label>
              <input id="inputSizeD" type="number" min="1" max="24" step="1">
            </div>
            <div class="field">
              <label for="inputMoveStep">移动步长</label>
              <select id="inputMoveStep">
                <option value="1">1 格</option>
                <option value="2">2 格</option>
                <option value="4">4 格</option>
              </select>
            </div>
          </div>
          <div class="button-grid">
            <button class="wide" id="btnMoveBlockToCell">移动到选中表面</button>
            <button class="wide" id="btnApplyBlock">应用尺寸/参数</button>
          </div>
          <p class="control-subtitle">移动微调</p>
          <div class="axis-grid" aria-label="Block 移动微调">
            <button data-move-axis="0" data-move-delta="-1">X -</button>
            <button data-move-axis="1" data-move-delta="-1">Y -</button>
            <button data-move-axis="2" data-move-delta="-1">Z -</button>
            <button data-move-axis="0" data-move-delta="1">X +</button>
            <button data-move-axis="1" data-move-delta="1">Y +</button>
            <button data-move-axis="2" data-move-delta="1">Z +</button>
          </div>
          <p class="control-subtitle">旋转微调</p>
          <div class="axis-grid" aria-label="Block 旋转微调">
            <button data-rotate-axis="0" data-rotate-delta="-1">X -</button>
            <button data-rotate-axis="1" data-rotate-delta="-1">Y -</button>
            <button data-rotate-axis="2" data-rotate-delta="-1">Z -</button>
            <button data-rotate-axis="0" data-rotate-delta="1">X +</button>
            <button data-rotate-axis="1" data-rotate-delta="1">Y +</button>
            <button data-rotate-axis="2" data-rotate-delta="1">Z +</button>
          </div>
          <details class="exact-panel">
            <summary>精确坐标与角度</summary>
            <div class="field-grid">
            <div class="field">
              <label for="inputPosX">位置 X</label>
              <input id="inputPosX" type="number" step="0.5">
            </div>
            <div class="field">
              <label for="inputPosY">位置 Y</label>
              <input id="inputPosY" type="number" step="0.5">
            </div>
            <div class="field">
              <label for="inputPosZ">位置 Z</label>
              <input id="inputPosZ" type="number" step="0.5">
            </div>
            <div class="field">
              <label for="inputRotX">旋转 X</label>
              <input id="inputRotX" type="number" step="1">
            </div>
            <div class="field">
              <label for="inputRotY">旋转 Y</label>
              <input id="inputRotY" type="number" step="1">
            </div>
            <div class="field">
              <label for="inputRotZ">旋转 Z</label>
              <input id="inputRotZ" type="number" step="1">
            </div>
          </div>
          </details>
          <p class="small-note" id="selectedBlockNote">未选中 Block</p>
        </section>

        <section class="control-section">
          <h2 class="panel-title">模式</h2>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "./vendor/OrbitControls.js";

    const FACES = ["front", "right", "back", "left", "top", "bottom"];
    const DIRS = {
      U: { dr: -1, dc: 0 },
      D: { dr: 1, dc: 0 },
      L: { dr: 0, dc: -1 },
      R: { dr: 0, dc: 1 }
    };
    const OPPOSITE_DIR = { U: "D", D: "U", L: "R", R: "L" };
    const PALETTE = ["#19d8ff", "#b875ff", "#a8ef32", "#ff4f7a", "#ffc857", "#43e6a1", "#ff8f5f", "#77a8ff"];
    const BLOCK_COLORS = ["#19d8ff", "#b875ff", "#a8ef32", "#ff8f5f", "#77a8ff", "#ffc857"];
    const EPS = 1e-4;
    const HASH_SCALE = 1000;

    const state = {
      level: 1,
      snapAngle: 15,
      mode: "structure",
      blocks: [],
      surface: emptySurface(),
      arrows: [],
      gridMap: new Map(),
      blockedCells: new Set(),
      selectedBlockId: null,
      selectedCellId: null,
      selectedArrowId: null,
      drawPath: [],
      lineStyle: false,
      showCovered: false,
      lastSolve: null,
      lastCameraFrame: null
    };

    const els = {
      statusLine: document.getElementById("statusLine"),
      statBlocks: document.getElementById("statBlocks"),
      statSurface: document.getElementById("statSurface"),
      statArrows: document.getElementById("statArrows"),
      statIssues: document.getElementById("statIssues"),
      blockList: document.getElementById("blockList"),
      inputSnap: document.getElementById("inputSnap"),
      inputDebugCovered: document.getElementById("inputDebugCovered"),
      inputSizeW: document.getElementById("inputSizeW"),
      inputSizeH: document.getElementById("inputSizeH"),
      inputSizeD: document.getElementById("inputSizeD"),
      inputMoveStep: document.getElementById("inputMoveStep"),
      inputPosX: document.getElementById("inputPosX"),
      inputPosY: document.getElementById("inputPosY"),
      inputPosZ: document.getElementById("inputPosZ"),
      inputRotX: document.getElementById("inputRotX"),
      inputRotY: document.getElementById("inputRotY"),
      inputRotZ: document.getElementById("inputRotZ"),
      selectedBlockNote: document.getElementById("selectedBlockNote"),
      inputFillRate: document.getElementById("inputFillRate"),
      inputLengthWeights: document.getElementById("inputLengthWeights"),
      inputBendWeights: document.getElementById("inputBendWeights"),
      inputCrossRate: document.getElementById("inputCrossRate"),
      drawDirection: document.getElementById("drawDirection"),
      lineStyle: document.getElementById("lineStyle"),
      issueList: document.getElementById("issueList"),
      atlasList: document.getElementById("atlasList"),
      atlasSub: document.getElementById("atlasSub"),
      atlasTitle: document.getElementById("atlasTitle"),
      atlasBody: document.getElementById("atlasBody"),
      mapChip: document.getElementById("mapChip"),
      solveChip: document.getElementById("solveChip"),
      cellChip: document.getElementById("cellChip"),
      selectedChip: document.getElementById("selectedChip"),
      snapChip: document.getElementById("snapChip"),
      inspectorTitle: document.getElementById("inspectorTitle"),
      inspectorBody: document.getElementById("inspectorBody"),
      jsonBox: document.getElementById("jsonBox"),
      jsonNote: document.getElementById("jsonNote"),
      viewportHost: document.getElementById("viewportHost"),
      threeCanvas: document.getElementById("threeViewport")
    };

    let scene;
    let camera;
    let renderer;
    let controls;
    let worldGroup;
    let raycaster;
    let pointer;
    let pointerDown = null;
    let animationHandle = null;

    function emptySurface() {
      return {
        rawCells: [],
        coveredCells: [],
        cells: new Map(),
        graph: new Map(),
        issues: [],
        components: [],
        canGenerate: false
      };
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function randomInt(max) {
      return Math.floor(Math.random() * max);
    }

    function shuffle(items) {
      const out = [...items];
      for (let i = out.length - 1; i > 0; i -= 1) {
        const j = randomInt(i + 1);
        [out[i], out[j]] = [out[j], out[i]];
      }
      return out;
    }

    function vec(x, y, z) {
      return new THREE.Vector3(x, y, z);
    }

    function cloneArray(values) {
      return values.map((value) => Number(value));
    }

    function roundTo(value, step) {
      return Math.round(value / step) * step;
    }

    function nextBlockId() {
      const used = new Set(state.blocks.map((block) => block.id));
      for (let i = 0; i < 26; i += 1) {
        const id = String.fromCharCode(65 + i);
        if (!used.has(id)) return id;
      }
      let n = state.blocks.length + 1;
      while (used.has(`B${n}`)) n += 1;
      return `B${n}`;
    }

    function normalizeBlock(raw, fallbackId = nextBlockId()) {
      const size = cloneArray(raw.Size || raw.size || [4, 4, 4]).map((value) => clamp(Math.round(value || 1), 1, 24));
      const position = cloneArray(raw.Position || raw.position || [0, 0, 0]).map((value) => Number.isFinite(value) ? value : 0);
      const rotationDeg = cloneArray(raw.RotationDeg || raw.rotationDeg || [0, 0, 0]).map((value) => Number.isFinite(value) ? value : 0);
      return {
        id: String(raw.Id || raw.id || fallbackId),
        size,
        position,
        rotationDeg,
        rotationOrder: raw.RotationOrder || raw.rotationOrder || "XYZ",
        color: raw.Color || raw.color || BLOCK_COLORS[state.blocks.length % BLOCK_COLORS.length],
        locked: Boolean(raw.Locked ?? raw.locked),
        visible: raw.Visible ?? raw.visible ?? true
      };
    }

    function blockToJson(block) {
      return {
        Id: block.id,
        Size: cloneArray(block.size),
        Position: block.position.map((value) => Number(value.toFixed(3))),
        RotationDeg: block.rotationDeg.map((value) => Number(value.toFixed(3))),
        RotationOrder: block.rotationOrder,
        Color: block.color,
        Locked: block.locked,
        Visible: block.visible
      };
    }

    function blockQuaternion(block) {
      return new THREE.Quaternion().setFromEuler(new THREE.Euler(
        THREE.MathUtils.degToRad(block.rotationDeg[0]),
        THREE.MathUtils.degToRad(block.rotationDeg[1]),
        THREE.MathUtils.degToRad(block.rotationDeg[2]),
        block.rotationOrder || "XYZ"
      ));
    }

    function localToWorld(block, point) {
      return point.clone().applyQuaternion(blockQuaternion(block)).add(vec(...block.position));
    }

    function worldToLocal(block, point) {
      return point.clone().sub(vec(...block.position)).applyQuaternion(blockQuaternion(block).invert());
    }

    function normalToWorld(block, normal) {
      return normal.clone().applyQuaternion(blockQuaternion(block)).normalize();
    }

    function faceSpec(block, face) {
      const [W, H, D] = block.size;
      const specs = {
        front: { rows: H, cols: W, normal: vec(0, 0, 1), u: vec(1, 0, 0), v: vec(0, -1, 0), half: D / 2 },
        back: { rows: H, cols: W, normal: vec(0, 0, -1), u: vec(-1, 0, 0), v: vec(0, -1, 0), half: D / 2 },
        right: { rows: H, cols: D, normal: vec(1, 0, 0), u: vec(0, 0, -1), v: vec(0, -1, 0), half: W / 2 },
        left: { rows: H, cols: D, normal: vec(-1, 0, 0), u: vec(0, 0, 1), v: vec(0, -1, 0), half: W / 2 },
        top: { rows: D, cols: W, normal: vec(0, 1, 0), u: vec(1, 0, 0), v: vec(0, 0, 1), half: H / 2 },
        bottom: { rows: D, cols: W, normal: vec(0, -1, 0), u: vec(1, 0, 0), v: vec(0, 0, -1), half: H / 2 }
      };
      return specs[face];
    }

    function edgeFromCorners(corners, dir) {
      const [tl, tr, br, bl] = corners;
      const endpoints = {
        U: [tl, tr],
        D: [bl, br],
        L: [tl, bl],
        R: [tr, br]
      }[dir];
      const a = endpoints[0];
      const b = endpoints[1];
      return {
        a,
        b,
        center: a.clone().add(b).multiplyScalar(0.5),
        dir: b.clone().sub(a).normalize(),
        length: a.distanceTo(b)
      };
    }

    function generateBlockSurfaceCells(block) {
      const cells = [];
      for (const face of FACES) {
        const spec = faceSpec(block, face);
        for (let r = 0; r < spec.rows; r += 1) {
          for (let c = 0; c < spec.cols; c += 1) {
            const localCenter = spec.normal.clone().multiplyScalar(spec.half)
              .add(spec.u.clone().multiplyScalar(c + 0.5 - spec.cols / 2))
              .add(spec.v.clone().multiplyScalar(r + 0.5 - spec.rows / 2));
            const localCorners = [
              localCenter.clone().add(spec.u.clone().multiplyScalar(-0.5)).add(spec.v.clone().multiplyScalar(-0.5)),
              localCenter.clone().add(spec.u.clone().multiplyScalar(0.5)).add(spec.v.clone().multiplyScalar(-0.5)),
              localCenter.clone().add(spec.u.clone().multiplyScalar(0.5)).add(spec.v.clone().multiplyScalar(0.5)),
              localCenter.clone().add(spec.u.clone().multiplyScalar(-0.5)).add(spec.v.clone().multiplyScalar(0.5))
            ];
            const corners = localCorners.map((corner) => localToWorld(block, corner));
            const center = localToWorld(block, localCenter);
            const normal = normalToWorld(block, spec.normal);
            const tangentU = normalToWorld(block, spec.u);
            const tangentV = normalToWorld(block, spec.v);
            const id = `${block.id}:${face}:${r}_${c}`;
            cells.push({
              id,
              blockId: block.id,
              face,
              r,
              c,
              rows: spec.rows,
              cols: spec.cols,
              center,
              normal,
              tangentU,
              tangentV,
              corners,
              edges: {
                U: edgeFromCorners(corners, "U"),
                D: edgeFromCorners(corners, "D"),
                L: edgeFromCorners(corners, "L"),
                R: edgeFromCorners(corners, "R")
              },
              removedReason: null
            });
          }
        }
      }
      return cells;
    }

    function isInsideOrFaceContact(localPoint, size) {
      const half = size.map((value) => value / 2);
      const abs = [Math.abs(localPoint.x), Math.abs(localPoint.y), Math.abs(localPoint.z)];
      if (abs.some((value, index) => value > half[index] + EPS)) return false;
      const boundaryCount = abs.filter((value, index) => value > half[index] - EPS).length;
      return boundaryCount <= 1;
    }

    function isCellCoveredByBlock(cell, block) {
      if (cell.blockId === block.id || !block.visible) return false;
      return isInsideOrFaceContact(worldToLocal(block, cell.center), block.size);
    }

    function q(value) {
      return Math.round(value * HASH_SCALE);
    }

    function pointKey(point) {
      return `${q(point.x)},${q(point.y)},${q(point.z)}`;
    }

    function canonicalEdgeKey(edge) {
      const a = pointKey(edge.a);
      const b = pointKey(edge.b);
      return a < b ? `${a}|${b}` : `${b}|${a}`;
    }

    function normalKey(normal) {
      return `${q(normal.x)},${q(normal.y)},${q(normal.z)}`;
    }

    function planeKey(cell) {
      return `${normalKey(cell.normal)}|${q(cell.normal.dot(cell.center))}`;
    }

    function directedKey(cellId, dir) {
      return `${cellId}|${dir}`;
    }

    function relationBetween(a, b) {
      return a.normal.dot(b.normal) > 0.985 && Math.abs(a.normal.dot(a.center) - b.normal.dot(b.center)) < 0.01
        ? "coplanar"
        : "edge_fold";
    }

    function buildSurface() {
      const rawCells = state.blocks.filter((block) => block.visible).flatMap(generateBlockSurfaceCells);
      const visible = [];
      const covered = [];

      for (const cell of rawCells) {
        const cover = state.blocks.find((block) => isCellCoveredByBlock(cell, block));
        if (cover) {
          cell.removedReason = `covered_by:${cover.id}`;
          covered.push(cell);
        } else {
          visible.push(cell);
        }
      }

      const cells = new Map(visible.map((cell) => [cell.id, cell]));
      const graph = new Map();
      const issues = [];
      const buckets = new Map();

      for (const cell of visible) {
        for (const dir of Object.keys(DIRS)) {
          const edge = cell.edges[dir];
          const key = canonicalEdgeKey(edge);
          if (!buckets.has(key)) buckets.set(key, []);
          buckets.get(key).push({ cell, dir, edge });
        }
      }

      for (const entries of buckets.values()) {
        if (entries.length === 2) {
          const [a, b] = entries;
          const relation = relationBetween(a.cell, b.cell);
          graph.set(directedKey(a.cell.id, a.dir), {
            from: a.cell.id,
            fromDir: a.dir,
            to: b.cell.id,
            toDir: OPPOSITE_DIR[b.dir],
            continueDir: OPPOSITE_DIR[b.dir],
            relation
          });
          graph.set(directedKey(b.cell.id, b.dir), {
            from: b.cell.id,
            fromDir: b.dir,
            to: a.cell.id,
            toDir: OPPOSITE_DIR[a.dir],
            continueDir: OPPOSITE_DIR[a.dir],
            relation
          });
        } else if (entries.length > 2) {
          for (const entry of entries) {
            issues.push({
              type: "ambiguous_edge",
              cellId: entry.cell.id,
              dir: entry.dir,
              candidates: entries.filter((item) => item.cell.id !== entry.cell.id).map((item) => item.cell.id)
            });
          }
        }
      }

      const components = findComponents(cells, graph);
      if (!cells.size) issues.push({ type: "empty_surface" });
      if (components.length > 1) {
        issues.push({
          type: "disconnected_surface",
          components: components.map((component, index) => ({ id: index, cellCount: component.length }))
        });
      }

      state.surface = {
        rawCells,
        coveredCells: covered,
        cells,
        graph,
        issues,
        components,
        canGenerate: cells.size > 0 && issues.length === 0
      };

      pruneInvalidCells();
    }

    function findComponents(cells, graph) {
      const seen = new Set();
      const components = [];
      for (const id of cells.keys()) {
        if (seen.has(id)) continue;
        const queue = [id];
        const component = [];
        seen.add(id);
        while (queue.length) {
          const current = queue.shift();
          component.push(current);
          for (const dir of Object.keys(DIRS)) {
            const step = graph.get(directedKey(current, dir));
            if (step && !seen.has(step.to)) {
              seen.add(step.to);
              queue.push(step.to);
            }
          }
        }
        components.push(component);
      }
      return components;
    }

    function pruneInvalidCells() {
      for (const cellId of [...state.blockedCells]) {
        if (!state.surface.cells.has(cellId)) state.blockedCells.delete(cellId);
      }
      state.arrows = state.arrows.filter((arrow) => arrow.path.every((cellId) => state.surface.cells.has(cellId)));
      syncGrid();
      if (state.selectedCellId && !state.surface.cells.has(state.selectedCellId)) state.selectedCellId = null;
    }

    function syncGrid(arrows = state.arrows) {
      state.gridMap = new Map();
      for (const arrow of arrows) {
        for (const cellId of arrow.path) state.gridMap.set(cellId, arrow.id);
      }
    }

    function getBlock(id) {
      return state.blocks.find((block) => block.id === id) || null;
    }

    function getArrow(id, arrows = state.arrows) {
      return arrows.find((arrow) => arrow.id === id) || null;
    }

    function nextArrowId() {
      return state.arrows.length ? Math.max(...state.arrows.map((arrow) => arrow.id)) + 1 : 0;
    }

    function parseWeights(input, fallback) {
      const source = input || fallback;
      const parsed = source.split(",")
        .map((part) => part.trim())
        .filter(Boolean)
        .map((part) => {
          const [valueRaw, weightRaw] = part.split(":");
          return { value: Number(valueRaw), weight: Number(weightRaw) };
        })
        .filter((item) => Number.isFinite(item.value) && Number.isFinite(item.weight) && item.weight > 0);
      return parsed.length ? parsed : parseWeights(fallback, "1:1");
    }

    function sampleWeighted(input, fallback) {
      const parsed = parseWeights(input, fallback);
      const total = parsed.reduce((sum, item) => sum + item.weight, 0);
      let roll = Math.random() * total;
      for (const item of parsed) {
        roll -= item.weight;
        if (roll <= 0) return item.value;
      }
      return parsed[parsed.length - 1].value;
    }

    function findDirectionBetweenCells(fromId, toId, graph = state.surface.graph) {
      for (const dir of Object.keys(DIRS)) {
        const step = graph.get(directedKey(fromId, dir));
        if (step?.to === toId) return dir;
      }
      return null;
    }

    function inferHeadDirectionFromPath(path, graph = state.surface.graph) {
      if (path.length < 2) return null;
      const firstDir = findDirectionBetweenCells(path[0], path[1], graph);
      if (!firstDir) return null;
      if (path.length >= 3) {
        const secondDir = findDirectionBetweenCells(path[1], path[2], graph);
        if (secondDir !== firstDir) return null;
      }
      return firstDir;
    }

    function getPlanarRay(cellId, dir, graph = state.surface.graph, cells = state.surface.cells) {
      const ray = [];
      let currentId = cellId;
      let currentDir = dir;
      const start = cells.get(cellId);
      if (!start) return ray;
      const startPlane = planeKey(start);
      const seen = new Set([cellId]);
      for (let guard = 0; guard < cells.size + 8; guard += 1) {
        const step = graph.get(directedKey(currentId, currentDir));
        if (!step) break;
        const next = cells.get(step.to);
        if (!next || planeKey(next) !== startPlane) break;
        if (seen.has(next.id)) break;
        ray.push(next.id);
        seen.add(next.id);
        currentId = next.id;
        currentDir = step.continueDir || step.toDir;
      }
      return ray;
    }

    function getForwardRay(cellId, dir, graph = state.surface.graph, cells = state.surface.cells) {
      const ray = [];
      const steps = [];
      let currentId = cellId;
      let currentDir = dir;
      const visited = new Set();
      if (!cells.has(cellId)) {
        return { cells: ray, steps, stopReason: "issue", cycle: false };
      }
      for (let guard = 0; guard < cells.size + 8; guard += 1) {
        const stateKey = directedKey(currentId, currentDir);
        if (visited.has(stateKey)) {
          return { cells: ray, steps, stopReason: "cycle", cycle: true };
        }
        visited.add(stateKey);
        const step = graph.get(directedKey(currentId, currentDir));
        if (!step) break;
        if (!cells.has(step.to)) {
          return { cells: ray, steps, stopReason: "issue", cycle: false };
        }
        if (step.relation === "edge_fold") {
          return { cells: ray, steps, stopReason: "fold_boundary", cycle: false };
        }
        steps.push(step);
        ray.push(step.to);
        currentId = step.to;
        currentDir = step.continueDir || step.toDir;
      }
      return {
        cells: ray,
        steps,
        stopReason: "boundary",
        cycle: false
      };
    }

    function getSurfaceTrace(cellId, dir, graph = state.surface.graph, cells = state.surface.cells) {
      const ray = [];
      const steps = [];
      let currentId = cellId;
      let currentDir = dir;
      const visited = new Set();
      if (!cells.has(cellId)) {
        return { cells: ray, steps, stopReason: "issue", cycle: false };
      }
      for (let guard = 0; guard < cells.size + 8; guard += 1) {
        const stateKey = directedKey(currentId, currentDir);
        if (visited.has(stateKey)) {
          return { cells: ray, steps, stopReason: "cycle", cycle: true };
        }
        visited.add(stateKey);
        const step = graph.get(directedKey(currentId, currentDir));
        if (!step) break;
        if (!cells.has(step.to)) {
          return { cells: ray, steps, stopReason: "issue", cycle: false };
        }
        steps.push(step);
        ray.push(step.to);
        currentId = step.to;
        currentDir = step.continueDir || step.toDir;
      }
      return {
        cells: ray,
        steps,
        stopReason: "boundary",
        cycle: false
      };
    }

    function getSurfaceForwardRay(cellId, dir, graph = state.surface.graph, cells = state.surface.cells) {
      return getForwardRay(cellId, dir, graph, cells).cells;
    }

    function validateArrowPath(path, dir, options = {}) {
      const {
        arrows = state.arrows,
        ignoreArrowId = null,
        blockedCells = state.blockedCells,
        graph = state.surface.graph,
        cells = state.surface.cells
      } = options;
      if (!Array.isArray(path) || !path.length) throw new Error("路径不能为空");
      const local = new Set();
      const occupied = new Map();
      for (const arrow of arrows) {
        if (arrow.id === ignoreArrowId) continue;
        for (const cellId of arrow.path) occupied.set(cellId, arrow.id);
      }
      for (let i = 0; i < path.length; i += 1) {
        const cellId = path[i];
        if (!cells.has(cellId)) throw new Error(`路径不在外表面：${cellId}`);
        if (blockedCells.has(cellId)) throw new Error(`路径进入禁区：${cellId}`);
        if (local.has(cellId)) throw new Error(`同一箭头重复占格：${cellId}`);
        if (occupied.has(cellId)) throw new Error(`路径与其他箭头重叠：${cellId}`);
        if (i > 0 && !findDirectionBetweenCells(path[i - 1], cellId, graph)) {
          throw new Error(`路径不连续：${path[i - 1]} -> ${cellId}`);
        }
        local.add(cellId);
      }
      if (dir) {
        const inferred = inferHeadDirectionFromPath(path, graph);
        if (path.length >= 2 && !inferred) throw new Error("头部后两节身体必须沿同一方向延展");
        const expected = inferred ? OPPOSITE_DIR[inferred] : dir;
        if (dir !== expected) throw new Error(`箭头方向必须背向头部身体延展方向：应为 ${expected}，当前为 ${dir}`);
        for (const cellId of getPlanarRay(path[0], dir, graph, cells)) {
          if (local.has(cellId)) throw new Error(`头部射线穿过自身身体：${cellId}`);
        }
        const headPlane = planeKey(cells.get(path[0]));
        for (const cellId of getSurfaceTrace(path[0], dir, graph, cells).cells) {
          const cell = cells.get(cellId);
          if (cell && planeKey(cell) !== headPlane && local.has(cellId)) {
            throw new Error(`头部朝向不能正对自己的跨面身体：${cellId}`);
          }
        }
      }
      return true;
    }

    function makeArrow(path, dir, color = null, id = null) {
      return {
        id: id ?? nextArrowId(),
        dir,
        path: [...path],
        color: color || PALETTE[(id ?? nextArrowId()) % PALETTE.length]
      };
    }

    function canRemoveArrow(arrow, arrows = state.arrows) {
      const grid = new Map();
      for (const item of arrows) {
        for (const cellId of item.path) grid.set(cellId, item.id);
      }
      const forward = getForwardRay(arrow.path[0], arrow.dir);
      if (forward.cycle || forward.stopReason === "issue") return false;
      for (const cellId of forward.cells) {
        const id = grid.get(cellId);
        if (id !== undefined && id !== arrow.id) return false;
      }
      return true;
    }

    function quickSolveCheck(arrows = state.arrows) {
      let remaining = arrows.map((arrow) => ({ ...arrow, path: [...arrow.path] }));
      const order = [];
      let guard = 0;
      while (remaining.length && guard < 2000) {
        guard += 1;
        const removable = remaining.filter((arrow) => canRemoveArrow(arrow, remaining));
        if (!removable.length) {
          return { solvable: false, removed: order, stuck: remaining.map((arrow) => arrow.id) };
        }
        for (const arrow of removable) order.push(arrow.id);
        const ids = new Set(removable.map((arrow) => arrow.id));
        remaining = remaining.filter((arrow) => !ids.has(arrow.id));
      }
      return { solvable: remaining.length === 0, removed: order, stuck: remaining.map((arrow) => arrow.id) };
    }

    function currentlyRemovableIds() {
      return new Set(state.arrows.filter((arrow) => canRemoveArrow(arrow)).map((arrow) => arrow.id));
    }

    function generateRandomPath(startId, length, targetBends, crossRate) {
      if (length <= 1) return [startId];
      for (let attempt = 0; attempt < 120; attempt += 1) {
        const path = [startId];
        const pathSet = new Set(path);
        let currentDir = null;
        let bends = 0;
        while (path.length < length) {
          const currentId = path[path.length - 1];
          let options = Object.keys(DIRS)
            .map((dir) => ({ dir, step: state.surface.graph.get(directedKey(currentId, dir)) }))
            .filter((item) => item.step && !pathSet.has(item.step.to) && !state.gridMap.has(item.step.to) && !state.blockedCells.has(item.step.to))
            .map((item) => ({
              dir: item.dir,
              step: item.step,
              nextBends: currentDir && item.dir !== currentDir ? bends + 1 : bends,
              crossed: item.step.relation === "edge_fold"
            }))
            .filter((item) => item.nextBends <= targetBends);
          if (!options.length) break;
          const crossing = options.filter((item) => item.crossed);
          const planar = options.filter((item) => !item.crossed);
          if (crossing.length && Math.random() < crossRate) options = crossing;
          else if (planar.length) options = planar;
          const weighted = options.flatMap((item) => {
            const continuing = currentDir && item.dir === currentDir;
            const weight = item.crossed ? 4 : continuing ? 3 : 1;
            return Array.from({ length: weight }, () => item);
          });
          const pick = weighted[randomInt(weighted.length)];
          path.push(pick.step.to);
          pathSet.add(pick.step.to);
          currentDir = pick.dir;
          bends = pick.nextBends;
        }
        if (path.length === length) return path;
      }
      return null;
    }

    function addRandomArrow() {
      const starts = shuffle([...state.surface.cells.keys()].filter((id) => !state.gridMap.has(id) && !state.blockedCells.has(id)));
      const crossRate = clamp(Number(els.inputCrossRate.value) || 0, 0, 1);
      for (const startId of starts.slice(0, 160)) {
        for (let attempt = 0; attempt < 16; attempt += 1) {
          const length = Math.max(2, sampleWeighted(els.inputLengthWeights.value, "2:20,3:30,4:24,5:14,6:8"));
          const bends = sampleWeighted(els.inputBendWeights.value, "0:32,1:38,2:24,3:6");
          const path = generateRandomPath(startId, length, bends, crossRate);
          if (!path) continue;
          const inferred = inferHeadDirectionFromPath(path);
          if (!inferred) continue;
          const dir = OPPOSITE_DIR[inferred];
          try {
            validateArrowPath(path, dir);
            const arrow = makeArrow(path, dir);
            const candidate = [...state.arrows, arrow];
            const solve = quickSolveCheck(candidate);
            if (!solve.solvable) continue;
            state.arrows.push(arrow);
            syncGrid();
            state.selectedArrowId = arrow.id;
            state.lastSolve = solve;
            return true;
          } catch {
            // Try another candidate.
          }
        }
      }
      return false;
    }

    function fillGeneratedArrows() {
      if (!state.surface.canGenerate) {
        setStatus("地图结构存在问题，不能生成箭头");
        renderAll();
        return;
      }
      state.arrows = [];
      state.selectedArrowId = null;
      syncGrid();
      const target = Math.floor([...state.surface.cells.keys()].filter((id) => !state.blockedCells.has(id)).length * clamp(Number(els.inputFillRate.value) || 0.34, 0.05, 0.88));
      let attempts = 0;
      let placed = 0;
      while (state.gridMap.size < target && attempts < 1400) {
        attempts += 1;
        if (addRandomArrow()) placed += 1;
      }
      state.lastSolve = quickSolveCheck();
      setStatus(`生成完成：${placed} 支箭头，占用 ${state.gridMap.size}/${state.surface.cells.size} 格`);
      renderAll();
    }

    function selectBlock(id) {
      state.selectedBlockId = id;
      syncBlockForm();
      setStatus(`已选中 Block ${id}`);
      renderAll();
    }

    function selectCell(cellId) {
      state.selectedCellId = cellId;
      const cell = state.surface.cells.get(cellId);
      if (cell) state.selectedBlockId = cell.blockId;
      syncBlockForm();
      setStatus(`已选中表面格 ${cellId}`);
      renderAll();
    }

    function syncBlockForm() {
      const block = getBlock(state.selectedBlockId);
      const disabled = !block;
      for (const input of [els.inputSizeW, els.inputSizeH, els.inputSizeD, els.inputPosX, els.inputPosY, els.inputPosZ, els.inputRotX, els.inputRotY, els.inputRotZ]) {
        input.disabled = disabled;
      }
      if (!block) {
        els.selectedBlockNote.textContent = "未选中 Block";
        return;
      }
      [els.inputSizeW.value, els.inputSizeH.value, els.inputSizeD.value] = block.size;
      [els.inputPosX.value, els.inputPosY.value, els.inputPosZ.value] = block.position.map((value) => Number(value.toFixed(2)));
      [els.inputRotX.value, els.inputRotY.value, els.inputRotZ.value] = block.rotationDeg.map((value) => Number(value.toFixed(1)));
      const targetCell = state.surface.cells.get(state.selectedCellId);
      const targetText = targetCell ? ` · 目标 ${targetCell.id}` : "";
      els.selectedBlockNote.textContent = `${block.id} · ${block.size.join("×")} · pos ${block.position.map((v) => Number(v.toFixed(1))).join(",")}${targetText}`;
    }

    function selectedSizeFromForm(fallback = [4, 4, 4]) {
      return [
        clamp(Math.round(Number(els.inputSizeW.value) || fallback[0] || 1), 1, 24),
        clamp(Math.round(Number(els.inputSizeH.value) || fallback[1] || 1), 1, 24),
        clamp(Math.round(Number(els.inputSizeD.value) || fallback[2] || 1), 1, 24)
      ];
    }

    function applyBlockForm() {
      const block = getBlock(state.selectedBlockId);
      if (!block) return setStatus("未选中 Block");
      const snap = Number(els.inputSnap.value) || 15;
      block.size = selectedSizeFromForm(block.size);
      block.position = [Number(els.inputPosX.value) || 0, Number(els.inputPosY.value) || 0, Number(els.inputPosZ.value) || 0];
      block.rotationDeg = [
        roundTo(Number(els.inputRotX.value) || 0, snap),
        roundTo(Number(els.inputRotY.value) || 0, snap),
        roundTo(Number(els.inputRotZ.value) || 0, snap)
      ];
      rebuildAfterStructureChange(`已应用 Block ${block.id}`);
    }

    function addBlock(block = null) {
      const id = nextBlockId();
      const created = normalizeBlock(block || {
        Id: id,
        Size: [4, 4, 4],
        Position: [state.blocks.length * 5, 0, 0],
        RotationDeg: [0, 0, 0],
        Color: BLOCK_COLORS[state.blocks.length % BLOCK_COLORS.length]
      }, id);
      state.blocks.push(created);
      state.selectedBlockId = created.id;
      rebuildAfterStructureChange(`已添加 Block ${created.id}`);
    }

    function duplicateSelectedBlock() {
      const block = getBlock(state.selectedBlockId);
      if (!block) return setStatus("未选中 Block");
      addBlock({
        ...blockToJson(block),
        Id: nextBlockId(),
        Position: [block.position[0] + 1.5, block.position[1] + 1.5, block.position[2] + 1.5],
        Color: BLOCK_COLORS[state.blocks.length % BLOCK_COLORS.length]
      });
    }

    function deleteSelectedBlock() {
      if (!state.selectedBlockId) return setStatus("未选中 Block");
      state.blocks = state.blocks.filter((block) => block.id !== state.selectedBlockId);
      state.selectedBlockId = state.blocks[0]?.id || null;
      rebuildAfterStructureChange("Block 已删除");
    }

    function matrixToEulerDeg(xAxis, yAxis, zAxis) {
      const matrix = new THREE.Matrix4();
      matrix.makeBasis(xAxis, yAxis, zAxis);
      const euler = new THREE.Euler().setFromRotationMatrix(matrix, "XYZ");
      return [
        THREE.MathUtils.radToDeg(euler.x),
        THREE.MathUtils.radToDeg(euler.y),
        THREE.MathUtils.radToDeg(euler.z)
      ].map((value) => roundTo(value, Number(els.inputSnap.value) || 15));
    }

    function centralInnerFaceAnchor(size) {
      const [width, height, depth] = size;
      const c = Math.floor(width / 2);
      const r = Math.floor(height / 2);
      return vec(c + 0.5 - width / 2, -(r + 0.5 - height / 2), -depth / 2);
    }

    function placementOnCell(cell, size) {
      const zAxis = cell.normal.clone().normalize();
      const xAxis = cell.tangentU.clone().normalize();
      const yAxis = cell.tangentV.clone().multiplyScalar(-1).normalize();
      const rotationDeg = matrixToEulerDeg(xAxis, yAxis, zAxis);
      const quat = blockQuaternion({ rotationDeg, rotationOrder: "XYZ" });
      const anchor = centralInnerFaceAnchor(size).applyQuaternion(quat);
      const position = cell.center.clone().sub(anchor);
      return {
        position: [position.x, position.y, position.z],
        rotationDeg
      };
    }

    function attachBlockToSelectedCell() {
      const cell = state.surface.cells.get(state.selectedCellId);
      if (!cell) return setStatus("先在 3D 或表面图集中选中一个外表面格");
      const id = nextBlockId();
      const size = selectedSizeFromForm([4, 4, 4]);
      const placement = placementOnCell(cell, size);
      addBlock({
        Id: id,
        Size: size,
        Position: placement.position,
        RotationDeg: placement.rotationDeg,
        Color: BLOCK_COLORS[state.blocks.length % BLOCK_COLORS.length]
      });
    }

    function moveSelectedBlockToCell() {
      const block = getBlock(state.selectedBlockId);
      const cell = state.surface.cells.get(state.selectedCellId);
      if (!block) return setStatus("未选中要移动的 Block");
      if (!cell) return setStatus("先选中一个目标表面格");
      if (block.id === cell.blockId) return setStatus("目标格在当前 Block 上，请先选目标格，再从列表选另一个 Block");
      const placement = placementOnCell(cell, block.size);
      block.position = placement.position;
      block.rotationDeg = placement.rotationDeg;
      block.rotationOrder = "XYZ";
      rebuildAfterStructureChange(`已将 Block ${block.id} 移动到 ${cell.id}`);
    }

    function nudgeSelectedBlock(axisIndex, sign) {
      const block = getBlock(state.selectedBlockId);
      if (!block) return setStatus("未选中 Block");
      const step = Number(els.inputMoveStep.value) || 1;
      block.position[axisIndex] = Number((block.position[axisIndex] + sign * step).toFixed(3));
      rebuildAfterStructureChange(`Block ${block.id} 已移动 ${["X", "Y", "Z"][axisIndex]} ${sign > 0 ? "+" : "-"}${step}`);
    }

    function rotateSelectedBlock(axisIndex, sign) {
      const block = getBlock(state.selectedBlockId);
      if (!block) return setStatus("未选中 Block");
      const snap = Number(els.inputSnap.value) || 15;
      block.rotationDeg[axisIndex] = roundTo(block.rotationDeg[axisIndex] + sign * snap, snap);
      rebuildAfterStructureChange(`Block ${block.id} 已旋转 ${["X", "Y", "Z"][axisIndex]} ${sign > 0 ? "+" : "-"}${snap}°`);
    }

    function rebuildAfterStructureChange(message = "结构已重建") {
      state.arrows = [];
      state.drawPath = [];
      state.selectedArrowId = null;
      state.lastSolve = null;
      buildSurface();
      syncBlockForm();
      setStatus(message);
      renderAll();
      exportLevel();
    }

    function handleCellAction(cellId) {
      if (state.mode === "structure") {
        selectCell(cellId);
        return;
      }
      if (state.mode === "block") {
        if (state.gridMap.has(cellId)) return setStatus("已有箭头的格子不能设为禁区");
        if (state.blockedCells.has(cellId)) state.blockedCells.delete(cellId);
        else state.blockedCells.add(cellId);
        state.lastSolve = null;
        renderAll();
        return;
      }
      if (state.mode === "draw") {
        addDrawCell(cellId);
        return;
      }
      const arrowId = state.gridMap.get(cellId);
      if (arrowId !== undefined) {
        removeArrowById(arrowId);
      } else {
        selectCell(cellId);
      }
    }

    function addDrawCell(cellId) {
      if (!state.surface.canGenerate) return setStatus("地图结构存在问题，不能绘制箭头");
      if (state.gridMap.has(cellId) || state.blockedCells.has(cellId)) return setStatus("绘制路径不能穿过占用格或禁区");
      if (state.drawPath.length) {
        const last = state.drawPath[state.drawPath.length - 1];
        if (last === cellId) return;
        if (state.drawPath.length > 1 && state.drawPath[state.drawPath.length - 2] === cellId) {
          state.drawPath.pop();
          renderAll();
          return;
        }
        if (!findDirectionBetweenCells(last, cellId)) return setStatus(`路径不连续：${last} -> ${cellId}`);
        if (state.drawPath.includes(cellId)) return setStatus("同一条路径不能重复占格");
      }
      state.drawPath.push(cellId);
      state.selectedCellId = cellId;
      setStatus(`绘制路径长度：${state.drawPath.length}`);
      renderAll();
    }

    function finishDrawPath() {
      if (!state.drawPath.length) return setStatus("没有正在绘制的路径");
      try {
        const inferred = inferHeadDirectionFromPath(state.drawPath);
        const dir = inferred ? OPPOSITE_DIR[inferred] : els.drawDirection.value;
        validateArrowPath(state.drawPath, dir);
        const arrow = makeArrow(state.drawPath, dir);
        const candidate = [...state.arrows, arrow];
        const solve = quickSolveCheck(candidate);
        if (!solve.solvable) throw new Error("放置后关卡不可解");
        state.arrows.push(arrow);
        state.selectedArrowId = arrow.id;
        state.drawPath = [];
        syncGrid();
        state.lastSolve = solve;
        setStatus(`手动绘制完成：#${arrow.id} ${dir}`);
        renderAll();
      } catch (error) {
        setStatus(error.message);
      }
    }

    function undoDrawPath() {
      state.drawPath.pop();
      setStatus(`绘制路径长度：${state.drawPath.length}`);
      renderAll();
    }

    function removeArrowById(id, force = false) {
      const arrow = getArrow(id);
      if (!arrow) return false;
      if (!force && !canRemoveArrow(arrow)) {
        state.selectedArrowId = id;
        const forward = getForwardRay(arrow.path[0], arrow.dir);
        const blockers = forward.cells.filter((cellId) => {
          const blockerId = state.gridMap.get(cellId);
          return blockerId !== undefined && blockerId !== id;
        });
        if (forward.cycle) {
          setStatus(`箭头 #${id} 的前进路径存在循环，不能移除`);
        } else {
          setStatus(`箭头 #${id} 被阻挡：${blockers.join("、") || "未知"}`);
        }
        renderAll();
        return false;
      }
      state.arrows = state.arrows.filter((item) => item.id !== id);
      if (state.selectedArrowId === id) state.selectedArrowId = null;
      syncGrid();
      state.lastSolve = quickSolveCheck();
      setStatus(force ? `已删除箭头 #${id}` : `已移除箭头 #${id}`);
      renderAll();
      return true;
    }

    function removeOneBatch() {
      const removable = [...currentlyRemovableIds()];
      if (!removable.length) {
        state.lastSolve = quickSolveCheck();
        setStatus("当前没有可移除箭头");
        renderAll();
        return;
      }
      state.arrows = state.arrows.filter((arrow) => !removable.includes(arrow.id));
      if (state.selectedArrowId !== null && removable.includes(state.selectedArrowId)) state.selectedArrowId = null;
      syncGrid();
      state.lastSolve = quickSolveCheck();
      setStatus(`已移除 ${removable.length} 支可移动箭头`);
      renderAll();
    }

    function clearArrows() {
      state.arrows = [];
      state.drawPath = [];
      state.selectedArrowId = null;
      syncGrid();
      state.lastSolve = null;
      setStatus("箭头已清空");
      renderAll();
    }

    function clearBlockedCells() {
      state.blockedCells.clear();
      setStatus("禁区已清除");
      renderAll();
    }

    function exportLevel() {
      const payload = {
        SchemaVersion: 4,
        BoardType: "compound_blocks",
        Level: state.level,
        GridUnit: 1,
        Snap: {
          AngleStep: state.snapAngle,
          AngleOptions: [15, 30, 45, 90],
          PositionStep: 1
        },
        Blocks: state.blocks.map(blockToJson),
        SurfacePolicy: {
          CoverageRule: "cell_center_inside_other_block",
          RemoveFaceContact: true,
          GenerateCutInteriorFaces: false,
          RequireConnected: true,
          RejectAmbiguousEdges: true
        },
        EditorConfig: {
          LengthWeights: els.inputLengthWeights.value,
          BendWeights: els.inputBendWeights.value,
          CrossFaceRate: Number(els.inputCrossRate.value),
          FillRate: Number(els.inputFillRate.value),
          LineStyle: state.lineStyle
        },
        MapValidation: {
          SurfaceCellCount: state.surface.cells.size,
          IssueCount: state.surface.issues.length,
          CanGenerate: state.surface.canGenerate
        },
        BlockedCells: [...state.blockedCells].sort(),
        Arrows: state.arrows.map((arrow) => ({
          Id: arrow.id,
          Dir: arrow.dir,
          Path: [...arrow.path],
          Color: arrow.color
        }))
      };
      els.jsonBox.value = JSON.stringify(payload, null, 2);
      els.jsonNote.textContent = `已导出 ${payload.Blocks.length} 个 Block，${payload.Arrows.length} 支箭头`;
      return payload;
    }

    function importLevel() {
      try {
        const payload = JSON.parse(els.jsonBox.value);
        if (payload.SchemaVersion !== 4) throw new Error("SchemaVersion 必须是 4");
        if (payload.BoardType !== "compound_blocks") throw new Error("BoardType 必须是 compound_blocks");
        if (!Array.isArray(payload.Blocks) || !payload.Blocks.length) throw new Error("Blocks 必须是非空数组");
        state.snapAngle = Number(payload.Snap?.AngleStep) || 15;
        els.inputSnap.value = String(state.snapAngle);
        state.blocks = payload.Blocks.map((raw, index) => normalizeBlock(raw, String.fromCharCode(65 + index)));
        state.selectedBlockId = state.blocks[0]?.id || null;
        buildSurface();
        state.blockedCells = new Set((payload.BlockedCells || []).filter((id) => state.surface.cells.has(id)));
        const importedArrows = [];
        for (const raw of payload.Arrows || []) {
          const path = [...raw.Path];
          const arrow = makeArrow(path, raw.Dir, raw.Color, raw.Id);
          validateArrowPath(arrow.path, arrow.dir, { arrows: importedArrows });
          importedArrows.push(arrow);
        }
        state.arrows = importedArrows;
        state.lineStyle = Boolean(payload.EditorConfig?.LineStyle);
        els.lineStyle.checked = state.lineStyle;
        document.body.classList.toggle("line-style", state.lineStyle);
        syncGrid();
        state.lastSolve = quickSolveCheck();
        syncBlockForm();
        setStatus(`导入完成：${state.blocks.length} 个 Block，${state.arrows.length} 支箭头`);
        renderAll();
      } catch (error) {
        setStatus(`导入失败：${error.message}`);
      }
    }

    function downloadJson() {
      const payload = exportLevel();
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `compound_arrow_level_${String(state.level).padStart(4, "0")}.json`;
      link.click();
      URL.revokeObjectURL(url);
      setStatus("JSON 文件已生成");
    }

    function loadSample() {
      state.blocks = [
        normalizeBlock({ Id: "A", Size: [6, 4, 4], Position: [0, 0, 0], RotationDeg: [0, 0, 0], Color: "#19d8ff" }, "A"),
        normalizeBlock({ Id: "B", Size: [4, 4, 4], Position: [5, 0, 0], RotationDeg: [0, 0, 0], Color: "#b875ff" }, "B"),
        normalizeBlock({ Id: "C", Size: [4, 4, 2], Position: [1, 4, 0], RotationDeg: [0, 0, 0], Color: "#a8ef32" }, "C")
      ];

      state.selectedCellId = null;

    function setMode(mode) {
      state.mode = mode;
      if (mode !== "draw") state.drawPath = [];
      for (const button of document.querySelectorAll(".segmented button")) {
        button.classList.toggle("active", button.dataset.mode === mode);
      }
      setStatus(`当前模式：${{ structure: "结构", play: "试玩", draw: "绘制", block: "禁区" }[mode]}`);

    function runValidate() {
      buildSurface();
      state.lastSolve = quickSolveCheck();
      const status = state.surface.canGenerate ? "地图可生成" : `地图存在 ${state.surface.issues.length} 个结构问题`;

    function renderAll() {
      renderBlockList();
      renderAtlas();

    function renderStats() {
      els.statBlocks.textContent = state.blocks.length;
      els.statSurface.textContent = state.surface.cells.size;
      els.statArrows.textContent = state.arrows.length;
      els.statIssues.textContent = state.surface.issues.length;
      els.cellChip.textContent = `${state.surface.cells.size} cells`;
      els.snapChip.textContent = `${state.snapAngle}° snap`;
      els.selectedChip.textContent = state.selectedCellId || state.selectedBlockId || "无选中";
      els.mapChip.textContent = state.surface.canGenerate ? "可生成" : "需修正";

    function renderIssues() {
      els.issueList.innerHTML = "";
      if (!state.surface.issues.length) {
        const div = document.createElement("div");
        div.className = "small-note";
        div.textContent = "暂无结构问题";
        els.issueList.appendChild(div);
