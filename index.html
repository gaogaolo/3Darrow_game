      }
      for (const issue of state.surface.issues.slice(0, 18)) {
        const div = document.createElement("div");
        div.className = "issue";
        if (issue.type === "ambiguous_edge") {
          div.textContent = `多候选边：${issue.cellId}|${issue.dir} -> ${issue.candidates.join("、")}`;
        } else if (issue.type === "disconnected_surface") {
          div.textContent = `地图未连通：${issue.components.map((item) => `${item.id}:${item.cellCount}`).join(" / ")}`;
        } else if (issue.type === "empty_surface") {
          div.textContent = "外表面为空";
        } else {
          div.textContent = issue.type;
        }
        els.issueList.appendChild(div);
      }
    }

    function renderBlockList() {
      els.blockList.innerHTML = "";
      for (const block of state.blocks) {
        const row = document.createElement("div");
        row.className = `block-row ${block.id === state.selectedBlockId ? "active" : ""}`;
        row.addEventListener("click", () => selectBlock(block.id));
        const swatch = document.createElement("span");
        swatch.className = "swatch";
        swatch.style.background = block.color;
        const meta = document.createElement("div");
        meta.className = "block-meta";
        meta.innerHTML = `<strong>Block ${block.id}</strong><span>${block.size.join("×")} · pos ${block.position.map((v) => Number(v.toFixed(1))).join(",")}</span>`;
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.textContent = block.rotationDeg.map((v) => Math.round(v)).join("/");
        row.append(swatch, meta, chip);
        els.blockList.appendChild(row);
      }
    }

    function groupSurfaceAtlas() {
      const groups = new Map();
      for (const cell of state.surface.cells.values()) {
        const key = planeKey(cell);
        if (!groups.has(key)) groups.set(key, { key, cells: [], normal: cell.normal.clone(), origin: cell.center.clone() });
        groups.get(key).cells.push(cell);
      }
      return [...groups.values()].sort((a, b) => b.cells.length - a.cells.length);
    }

    function atlasBasis(normal) {
      const helper = Math.abs(normal.y) < 0.9 ? vec(0, 1, 0) : vec(1, 0, 0);
      const u = new THREE.Vector3().crossVectors(helper, normal).normalize();
      const v = new THREE.Vector3().crossVectors(normal, u).normalize();
      return { u, v };
    }

    function renderAtlas() {
      els.atlasList.innerHTML = "";
      const drawSet = new Set(state.drawPath);
      const groups = groupSurfaceAtlas();
      for (const group of groups) {
        const basis = atlasBasis(group.normal);
        const positioned = group.cells.map((cell) => {
          const rel = cell.center.clone().sub(group.origin);
          return {
            cell,
            u: Math.round(rel.dot(basis.u)),
            v: Math.round(rel.dot(basis.v))
          };
        });
        const minU = Math.min(...positioned.map((item) => item.u));
        const minV = Math.min(...positioned.map((item) => item.v));
        const maxU = Math.max(...positioned.map((item) => item.u));
        const maxV = Math.max(...positioned.map((item) => item.v));
        const section = document.createElement("section");
        section.className = "atlas-group";
        const title = document.createElement("div");
        title.className = "atlas-title";
        title.innerHTML = `<span>${group.key}</span><span>${group.cells.length} cells</span>`;
        const wrap = document.createElement("div");
        wrap.className = "atlas-grid-wrap";
        const grid = document.createElement("div");
        grid.className = "atlas-grid";
        grid.style.gridTemplateColumns = `repeat(${Math.max(1, maxU - minU + 1)}, 18px)`;
        grid.style.gridTemplateRows = `repeat(${Math.max(1, maxV - minV + 1)}, 18px)`;
        for (const item of positioned) {
          const button = document.createElement("button");
          button.className = "atlas-cell";
          button.style.gridColumn = `${item.u - minU + 1}`;
          button.style.gridRow = `${item.v - minV + 1}`;
          button.title = item.cell.id;
          if (state.blockedCells.has(item.cell.id)) button.classList.add("blocked");
          const arrowId = state.gridMap.get(item.cell.id);
          if (arrowId !== undefined) {
            const arrow = getArrow(arrowId);
            button.classList.add("occupied");
            button.style.setProperty("--arrow-color", state.lineStyle ? "#f4fbff" : arrow.color);
          }
          if (state.selectedCellId === item.cell.id || drawSet.has(item.cell.id)) button.classList.add("selected");
          button.addEventListener("click", () => handleCellAction(item.cell.id));
          grid.appendChild(button);
        }
        wrap.appendChild(grid);
        section.append(title, wrap);
        els.atlasList.appendChild(section);
      }
    }

    function renderInspector() {
      const selectedCell = state.surface.cells.get(state.selectedCellId);
      const selectedBlock = getBlock(state.selectedBlockId);
      if (selectedCell) {
        const arrowId = state.gridMap.get(selectedCell.id);
        els.atlasTitle.textContent = selectedCell.id;
        els.atlasBody.textContent = `Block ${selectedCell.blockId} · ${selectedCell.face} · plane ${planeKey(selectedCell)}${arrowId !== undefined ? ` · arrow #${arrowId}` : ""}`;
      } else {
        els.atlasTitle.textContent = "未选中表面格";
        els.atlasBody.textContent = "点击 3D 表面格或图集格子后显示 Block、面、路径信息。";
      }
      if (selectedBlock) {
        els.inspectorTitle.textContent = `Block ${selectedBlock.id}`;
        els.inspectorBody.textContent = `${selectedBlock.size.join("×")} · pos ${selectedBlock.position.map((v) => Number(v.toFixed(2))).join(", ")} · rot ${selectedBlock.rotationDeg.map((v) => Math.round(v)).join(", ")}`;
      } else {
        els.inspectorTitle.textContent = "结构射线";
        els.inspectorBody.textContent = "组合体表面由 Block 原始外表面裁剪后生成。";
      }
    }

    function setStatus(message) {
      els.statusLine.textContent = message;
    }

    function initThree() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x070d14);
      camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);
      camera.position.set(9, 7, 10);
      renderer = new THREE.WebGLRenderer({
        canvas: els.threeCanvas,
        antialias: true,
        alpha: false,
        preserveDrawingBuffer: true
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.enablePan = true;
      controls.enableZoom = true;
      controls.minDistance = 4;
      controls.maxDistance = 32;
      raycaster = new THREE.Raycaster();
      pointer = new THREE.Vector2();
      worldGroup = new THREE.Group();
      scene.add(worldGroup);
      scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 2.2));
      const key = new THREE.DirectionalLight(0xffffff, 2);
      key.position.set(6, 9, 7);
      scene.add(key);
      const rim = new THREE.DirectionalLight(0x7adfff, 1.2);
      rim.position.set(-7, 2, -5);
      scene.add(rim);
      renderer.domElement.addEventListener("pointerdown", (event) => {
        pointerDown = { x: event.clientX, y: event.clientY, time: performance.now() };
      });
      renderer.domElement.addEventListener("pointerup", handlePointerUp);
      const resizeObserver = new ResizeObserver(resizeThree);
      resizeObserver.observe(els.viewportHost);
      resizeThree();
      resetCameraView(false);
      animate();
    }

    function shapeFramePoints() {
      const points = [];
      if (state.surface?.cells?.size) {
        for (const cell of state.surface.cells.values()) {
          for (const corner of cell.corners) points.push(corner.clone());
        }
      }
      if (!points.length) {
        for (const block of state.blocks) {
          if (!block.visible) continue;
          const [width, height, depth] = block.size;
          for (const sx of [-0.5, 0.5]) {
            for (const sy of [-0.5, 0.5]) {
              for (const sz of [-0.5, 0.5]) {
                points.push(localToWorld(block, vec(sx * width, sy * height, sz * depth)));
              }
            }
          }
        }
      }
      if (!points.length) {
        const fallback = new THREE.Box3().setFromCenterAndSize(vec(0, 0, 0), vec(6, 6, 6));
        const min = fallback.min;
        const max = fallback.max;
        return [
          vec(min.x, min.y, min.z),
          vec(min.x, min.y, max.z),
          vec(min.x, max.y, min.z),
          vec(min.x, max.y, max.z),
          vec(max.x, min.y, min.z),
          vec(max.x, min.y, max.z),
          vec(max.x, max.y, min.z),
          vec(max.x, max.y, max.z)
        ];
      }
      return points;
    }

    function boundsFromPoints(points) {
      const bounds = new THREE.Box3();
      for (const point of points) bounds.expandByPoint(point);
      return bounds;
    }

    function cameraBasis(direction) {
      const worldUp = Math.abs(direction.y) > 0.94 ? vec(0, 0, 1) : vec(0, 1, 0);
      const right = new THREE.Vector3().crossVectors(worldUp, direction).normalize();
      const up = new THREE.Vector3().crossVectors(direction, right).normalize();
      return { right, up };
    }

    function fitCameraToPoints(points, center, direction) {
      const aspect = Math.max(0.1, camera.aspect || 1);
      const vFov = THREE.MathUtils.degToRad(camera.fov);
      const hFov = 2 * Math.atan(Math.tan(vFov / 2) * aspect);
      const tanV = Math.tan(vFov / 2);
      const tanH = Math.tan(hFov / 2);
      const { right, up } = cameraBasis(direction);
      let requiredDistance = 4;
      let maxAhead = 0;
      let maxBehind = 0;
      let maxAbsX = 0;
      let maxAbsY = 0;
      for (const point of points) {
        const rel = point.clone().sub(center);
        const x = Math.abs(rel.dot(right));
        const y = Math.abs(rel.dot(up));
        const depthOffset = rel.dot(direction);
        maxAbsX = Math.max(maxAbsX, x);
        maxAbsY = Math.max(maxAbsY, y);
        maxAhead = Math.max(maxAhead, depthOffset);
        maxBehind = Math.max(maxBehind, -depthOffset);
        requiredDistance = Math.max(requiredDistance, x / Math.max(tanH, EPS) + depthOffset, y / Math.max(tanV, EPS) + depthOffset);
      }
      const distance = Math.max(7, requiredDistance * 1.22 + 0.75);
      let maxProjectedX = 0;
      let maxProjectedY = 0;
      for (const point of points) {
        const rel = point.clone().sub(center);
        const depthOffset = rel.dot(direction);
        const z = Math.max(0.001, distance - depthOffset);
        maxProjectedX = Math.max(maxProjectedX, Math.abs(rel.dot(right)) / (z * Math.max(tanH, EPS)));
        maxProjectedY = Math.max(maxProjectedY, Math.abs(rel.dot(up)) / (z * Math.max(tanV, EPS)));
      }
      const bounds = boundsFromPoints(points);
      const sphere = bounds.getBoundingSphere(new THREE.Sphere());
      return {
        distance,
        right,
        up,
        maxAhead,
        maxBehind,
        maxAbsX,
        maxAbsY,
        maxProjectedX,
        maxProjectedY,
        radius: sphere.radius
      };
    }

    function resetCameraView(announce = true) {
      if (!camera || !controls) return null;
      const points = shapeFramePoints();
      const bounds = boundsFromPoints(points);
      const center = bounds.getCenter(new THREE.Vector3());
      const direction = vec(0.92, 0.68, 1).normalize();
      const fit = fitCameraToPoints(points, center, direction);
      controls.target.copy(center);
      camera.position.copy(center.clone().add(direction.clone().multiplyScalar(fit.distance)));
      camera.near = Math.max(0.03, (fit.distance - fit.maxAhead) / 120);
      camera.far = Math.max(200, fit.distance + fit.maxBehind + fit.radius * 8);
      camera.up.set(0, 1, 0);
      camera.lookAt(center);
      camera.updateProjectionMatrix();
      controls.minDistance = Math.max(1.5, fit.radius * 0.2);
      controls.maxDistance = Math.max(32, fit.distance * 6, fit.radius * 10);
      controls.update();
      const frameInfo = {
        center: [center.x, center.y, center.z].map((value) => Number(value.toFixed(3))),
        distance: Number(fit.distance.toFixed(3)),
        radius: Number(fit.radius.toFixed(3)),
        pointCount: points.length,
        coverage: {
          maxProjectedX: Number(fit.maxProjectedX.toFixed(3)),
          maxProjectedY: Number(fit.maxProjectedY.toFixed(3))
        }
      };
      state.lastCameraFrame = frameInfo;
      renderFrame();
      if (announce) setStatus("视角已复位");
      return frameInfo;
    }

    function resizeThree() {
      if (!renderer || !camera) return;
      const rect = els.viewportHost.getBoundingClientRect();
      const width = Math.max(320, Math.floor(rect.width));
      const height = Math.max(420, Math.floor(rect.height));
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderFrame();
    }

    function renderFrame() {
      if (!renderer || !scene || !camera) return;
      controls?.update();
      renderer.render(scene, camera);
    }

    function animate() {
      animationHandle = requestAnimationFrame(animate);
      renderFrame();
    }

    function disposeGroup(group) {
      while (group.children.length) {
        const child = group.children.pop();
        child.traverse?.((node) => {
          node.geometry?.dispose?.();
          if (Array.isArray(node.material)) node.material.forEach((mat) => mat.dispose?.());
          else node.material?.dispose?.();
        });
      }
    }

    function renderThree() {
      if (!worldGroup) return;
      disposeGroup(worldGroup);
      const interactive = [];
      renderBlockShells();
      renderSurfaceCells(interactive);
      renderCoveredCells();
      renderArrows();
      renderIssueEdges();
      worldGroup.userData.interactive = interactive;
      renderFrame();
    }

    function renderBlockShells() {
      for (const block of state.blocks) {
        if (!block.visible) continue;
        const geo = new THREE.BoxGeometry(block.size[0], block.size[1], block.size[2]);
        const mat = new THREE.MeshStandardMaterial({
          color: block.color,
          transparent: true,
          opacity: block.id === state.selectedBlockId ? 0.14 : 0.07,
          roughness: 0.62,
          metalness: 0.08,
          side: THREE.DoubleSide
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(...block.position);
        mesh.quaternion.copy(blockQuaternion(block));
        worldGroup.add(mesh);
        const edges = new THREE.EdgesGeometry(geo);
        const lineMat = new THREE.LineBasicMaterial({ color: block.id === state.selectedBlockId ? 0xa8ef32 : 0x93b8cf, transparent: true, opacity: block.id === state.selectedBlockId ? 0.92 : 0.34 });
        const lines = new THREE.LineSegments(edges, lineMat);
        lines.position.copy(mesh.position);
        lines.quaternion.copy(mesh.quaternion);
        worldGroup.add(lines);
      }
    }

    function cellQuaternion(cell) {
      const xAxis = cell.tangentU.clone().normalize();
      const yAxis = cell.tangentV.clone().multiplyScalar(-1).normalize();
      const zAxis = cell.normal.clone().normalize();
      const matrix = new THREE.Matrix4();
      matrix.makeBasis(xAxis, yAxis, zAxis);
      return new THREE.Quaternion().setFromRotationMatrix(matrix);
    }

    function renderSurfaceCells(interactive) {
      const removable = currentlyRemovableIds();
      const drawSet = new Set(state.drawPath);
      const cellGeo = new THREE.PlaneGeometry(0.92, 0.92);
      for (const cell of state.surface.cells.values()) {
        const arrowId = state.gridMap.get(cell.id);
        const arrow = arrowId !== undefined ? getArrow(arrowId) : null;
        const block = getBlock(cell.blockId);
        let color = block?.color || "#19d8ff";
        let opacity = 0.38;
        if (state.blockedCells.has(cell.id)) {
          color = "#687988";
          opacity = 0.9;
        }
        if (drawSet.has(cell.id)) {
          color = "#ffc857";
          opacity = 0.96;
        }
        if (arrow) {
          color = state.lineStyle ? "#f4fbff" : arrow.color;
          opacity = 0.96;
        }
        const selected = state.selectedCellId === cell.id || (arrow && arrow.id === state.selectedArrowId);
        const mat = new THREE.MeshStandardMaterial({
          color,
          transparent: true,
          opacity,
          roughness: 0.58,
          metalness: 0.04,
          side: THREE.DoubleSide,
          emissive: selected ? new THREE.Color(0xa8ef32) : new THREE.Color(0x000000),
          emissiveIntensity: selected ? 0.28 : 0
        });
        const mesh = new THREE.Mesh(cellGeo, mat);
        mesh.position.copy(cell.center.clone().add(cell.normal.clone().multiplyScalar(0.018)));
        mesh.quaternion.copy(cellQuaternion(cell));
        mesh.userData = { type: "cell", cellId: cell.id, blockId: cell.blockId };
        worldGroup.add(mesh);
        interactive.push(mesh);
        if (arrow && removable.has(arrow.id)) {
          const ring = new THREE.Mesh(
            new THREE.RingGeometry(0.31, 0.41, 28),
            new THREE.MeshBasicMaterial({ color: 0xa8ef32, transparent: true, opacity: 0.78, side: THREE.DoubleSide })
          );
          ring.position.copy(cell.center.clone().add(cell.normal.clone().multiplyScalar(0.038)));
          ring.quaternion.copy(mesh.quaternion);
          worldGroup.add(ring);
        }
      }
    }

    function renderCoveredCells() {
      if (!state.showCovered) return;
      const cellGeo = new THREE.PlaneGeometry(0.9, 0.9);
      for (const cell of state.surface.coveredCells) {
        const mat = new THREE.MeshBasicMaterial({ color: 0xff4f7a, transparent: true, opacity: 0.22, side: THREE.DoubleSide });
        const mesh = new THREE.Mesh(cellGeo, mat);
        mesh.position.copy(cell.center.clone().add(cell.normal.clone().multiplyScalar(0.012)));
        mesh.quaternion.copy(cellQuaternion(cell));
        worldGroup.add(mesh);
      }
    }

    function renderArrows() {
      for (const arrow of state.arrows) {
        for (let i = 1; i < arrow.path.length; i += 1) {
          const a = state.surface.cells.get(arrow.path[i - 1]);
          const b = state.surface.cells.get(arrow.path[i]);
          if (!a || !b) continue;
          const start = a.center.clone().add(a.normal.clone().multiplyScalar(0.08));
          const end = b.center.clone().add(b.normal.clone().multiplyScalar(0.08));
          const cylinder = cylinderBetween(start, end, 0.07, state.lineStyle ? "#f4fbff" : arrow.color);
          cylinder.userData = { type: "arrow", arrowId: arrow.id };
          worldGroup.add(cylinder);
        }
        addHeadTriangle(arrow);
      }
    }

    function cylinderBetween(a, b, radius, color) {
      const direction = b.clone().sub(a);
      const length = direction.length();
      const geometry = new THREE.CylinderGeometry(radius, radius, Math.max(0.001, length), 12);
      const material = new THREE.MeshStandardMaterial({ color, roughness: 0.42, metalness: 0.08 });
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.copy(a.clone().add(b).multiplyScalar(0.5));
      mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
      return mesh;
    }

    function trianglePoints(dir, size) {
      const s = size;
      return {
        U: [[0, s], [-s * 0.78, -s * 0.62], [s * 0.78, -s * 0.62]],
        D: [[0, -s], [s * 0.78, s * 0.62], [-s * 0.78, s * 0.62]],
        L: [[-s, 0], [s * 0.62, -s * 0.78], [s * 0.62, s * 0.78]],
        R: [[s, 0], [-s * 0.62, s * 0.78], [-s * 0.62, -s * 0.78]]
      }[dir];
    }

    function addHeadTriangle(arrow) {
      const cell = state.surface.cells.get(arrow.path[0]);
      if (!cell) return;
      const shape = new THREE.Shape();
      const points = trianglePoints(arrow.dir, 0.36);
      shape.moveTo(points[0][0], points[0][1]);
      shape.lineTo(points[1][0], points[1][1]);
      shape.lineTo(points[2][0], points[2][1]);
      shape.closePath();
      const mesh = new THREE.Mesh(
        new THREE.ShapeGeometry(shape),
        new THREE.MeshStandardMaterial({
          color: state.lineStyle ? "#071018" : "#061018",
          roughness: 0.45,
          metalness: 0.05,
          side: THREE.DoubleSide,
          emissive: arrow.id === state.selectedArrowId ? new THREE.Color(0xa8ef32) : new THREE.Color(0x000000),
          emissiveIntensity: arrow.id === state.selectedArrowId ? 0.3 : 0
        })
      );
      mesh.position.copy(cell.center.clone().add(cell.normal.clone().multiplyScalar(0.11)));
      mesh.quaternion.copy(cellQuaternion(cell));
      mesh.userData = { type: "arrow", arrowId: arrow.id };
      worldGroup.add(mesh);
    }

    function renderIssueEdges() {
      const material = new THREE.LineBasicMaterial({ color: 0xff4f7a, transparent: true, opacity: 0.95 });
      for (const issue of state.surface.issues) {
        if (issue.type !== "ambiguous_edge") continue;
        const cell = state.surface.cells.get(issue.cellId);
        if (!cell) continue;
        const edge = cell.edges[issue.dir];
        const geo = new THREE.BufferGeometry().setFromPoints([
          edge.a.clone().add(cell.normal.clone().multiplyScalar(0.08)),
          edge.b.clone().add(cell.normal.clone().multiplyScalar(0.08))
        ]);
        worldGroup.add(new THREE.Line(geo, material));
      }
    }

    function handlePointerUp(event) {
      if (!pointerDown) return;
      const moved = Math.hypot(event.clientX - pointerDown.x, event.clientY - pointerDown.y);
      const elapsed = performance.now() - pointerDown.time;
      pointerDown = null;
      if (moved > 6 || elapsed > 650) return;
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(worldGroup.userData.interactive || [], false);
      if (!hits.length) return;
      const data = hits[0].object.userData;
      if (data.cellId) handleCellAction(data.cellId);
    }

    function wireEvents() {
      document.getElementById("btnGenerate").addEventListener("click", fillGeneratedArrows);
      document.getElementById("btnValidate").addEventListener("click", runValidate);
      document.getElementById("btnExport").addEventListener("click", () => {
        exportLevel();
        setStatus("JSON 已导出");
      });
      document.getElementById("btnClearArrows").addEventListener("click", clearArrows);
      document.getElementById("btnAddBlock").addEventListener("click", () => addBlock());
      document.getElementById("btnAttachBlock").addEventListener("click", attachBlockToSelectedCell);
      document.getElementById("btnDuplicateBlock").addEventListener("click", duplicateSelectedBlock);
      document.getElementById("btnDeleteBlock").addEventListener("click", deleteSelectedBlock);
      document.getElementById("btnMoveBlockToCell").addEventListener("click", moveSelectedBlockToCell);
      document.getElementById("btnApplyBlock").addEventListener("click", applyBlockForm);
      document.getElementById("btnUndoDraw").addEventListener("click", undoDrawPath);
      document.getElementById("btnFinishDraw").addEventListener("click", finishDrawPath);
      document.getElementById("btnClearBlocks").addEventListener("click", clearBlockedCells);
      document.getElementById("btnSolveStep").addEventListener("click", removeOneBatch);
      document.getElementById("btnResetCamera").addEventListener("click", () => resetCameraView(true));
      document.getElementById("btnImport").addEventListener("click", importLevel);
      document.getElementById("btnDownload").addEventListener("click", downloadJson);
      document.getElementById("btnSample").addEventListener("click", loadSample);
      els.inputSnap.addEventListener("change", () => {
        state.snapAngle = Number(els.inputSnap.value) || 15;
        renderStats();
      });
      els.inputDebugCovered.addEventListener("change", () => {
        state.showCovered = els.inputDebugCovered.checked;
        renderThree();
      });
      els.lineStyle.addEventListener("change", () => {
        state.lineStyle = els.lineStyle.checked;
        document.body.classList.toggle("line-style", state.lineStyle);
        renderAll();
      });
      for (const button of document.querySelectorAll(".segmented button")) {
        button.addEventListener("click", () => setMode(button.dataset.mode));
      }
      for (const button of document.querySelectorAll("[data-move-axis]")) {
        button.addEventListener("click", () => nudgeSelectedBlock(Number(button.dataset.moveAxis), Number(button.dataset.moveDelta)));
      }
      for (const button of document.querySelectorAll("[data-rotate-axis]")) {
        button.addEventListener("click", () => rotateSelectedBlock(Number(button.dataset.rotateAxis), Number(button.dataset.rotateDelta)));
      }
    }

    function bootstrap() {
      state.blocks = [
        normalizeBlock({ Id: "A", Size: [6, 4, 4], Position: [0, 0, 0], RotationDeg: [0, 0, 0], Color: "#19d8ff" }, "A"),
        normalizeBlock({ Id: "B", Size: [4, 4, 4], Position: [5, 0, 0], RotationDeg: [0, 0, 0], Color: "#b875ff" }, "B")
      ];
      state.selectedBlockId = "A";
      buildSurface();
      syncBlockForm();
      wireEvents();
      initThree();
      renderAll();
      exportLevel();
    }

    bootstrap();

    window.compoundArrowEditor = {
      state,
      buildSurface,
      findDirectionBetweenCells,
      getPlanarRay,
      getForwardRay,
      getSurfaceTrace,
      canRemoveArrow,
      quickSolveCheck,
      moveSelectedBlockToCell,
      resetCameraView,
      exportLevel,
      importLevel
    };

    window.addEventListener("beforeunload", () => {
      if (animationHandle) cancelAnimationFrame(animationHandle);
    });
  </script>
</body>
</html>
